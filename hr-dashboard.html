<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HR Dashboard | Aldovra</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d12">
<link rel="icon" type="image/png" href="/aldovra-logo.png">
<link rel="preconnect" href="https://lgefwfrjzweayfxahogs.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/aldovra-hr.css">
</head>
<body>
<div class="hr-app">
  <main class="hr-main">
    <div class="hr-wrap" id="hrContent">
      <div class="skel" style="height:200px;margin-bottom:24px"></div>
      <div class="hr-kpis"><div class="skel" style="height:120px"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:120px"></div><div class="skel" style="height:120px"></div></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/aldovra-hr.js"></script>
<script>
(function () {
  var H = window.AldHR, esc = H.esc, content = document.getElementById("hrContent");

  function greeting() {
    var h = new Date().getHours();
    return h < 12 ? "Good morning" : h < 17 ? "Good afternoon" : "Good evening";
  }

  function render(ctx, pool) {
    var me = ctx.me || {};
    var first = String(me.full_name || (me.email || "").split("@")[0] || "there").trim().split(/\s+/)[0];
    var weekAgo = Date.now() - 7 * 864e5;
    var newThisWeek = pool.filter(function (c) { return H.latestVerified(c) >= weekAgo; }).length;
    var skillCount = {}, totalSkills = 0;
    pool.forEach(function (c) {
      H.skillsOf(c).forEach(function (s) { totalSkills++; skillCount[s.name] = (skillCount[s.name] || 0) + 1; });
    });
    var topSkills = Object.keys(skillCount).sort(function (a, b) { return skillCount[b] - skillCount[a] || a.localeCompare(b); }).slice(0, 14);
    var recent = pool.slice().sort(function (a, b) { return H.latestVerified(b) - H.latestVerified(a); }).slice(0, 6);
    var poolLabel = pool.length >= 100 ? "100+" : String(pool.length);

    content.innerHTML =
      '<section class="hr-hero">' +
        "<div>" +
          '<div class="kicker reveal">Hiring workspace' + (me.company_name ? " · " + esc(me.company_name) : "") + "</div>" +
          '<h1 class="reveal">' + esc(greeting()) + ", <em>" + esc(first) + ".</em></h1>" +
          '<p class="reveal">Every candidate here passed a proctored Aldovra assessment with 75% or more, and our team reviewed their exam environment.</p>' +
        "</div>" +
        '<div class="reveal" style="display:flex;gap:10px;flex-wrap:wrap"><a class="btn dark" href="/hr-candidates.html">Browse candidates →</a>' +
        '<a class="btn" href="/hr-candidates.html#saved">Saved (' + H.savedCount() + ")</a></div>" +
      "</section>" +
      '<section class="hr-kpis">' +
        '<a class="hr-kpi reveal" href="/hr-candidates.html"><small>Verified candidates</small><b>' + poolLabel + "</b><span>students who chose to be visible</span></a>" +
        '<div class="hr-kpi reveal"><small>Verified skills</small><b>' + totalSkills + "</b><span>across " + Object.keys(skillCount).length + " different skills</span></div>" +
        '<div class="hr-kpi reveal"><small>New this week</small><b>' + newThisWeek + "</b><span>candidates verified in 7 days</span></div>" +
        '<a class="hr-kpi reveal" href="/hr-candidates.html#saved"><small>Saved by you</small><b>' + H.savedCount() + "</b><span>your shortlist</span></a>" +
      "</section>" +
      (pool.length
        ? '<section class="hr-sec"><div class="hr-sec-head"><div><div class="kicker">Talent pool</div><h2 class="hr-h2">Top verified <em>skills</em></h2></div></div>' +
            '<div class="hr-skills reveal">' + topSkills.map(function (s) {
              return '<a href="/hr-candidates.html?skill=' + encodeURIComponent(s) + '">' + esc(s) + " <i>" + skillCount[s] + "</i></a>";
            }).join("") + "</div></section>" +
          '<section class="hr-sec"><div class="hr-sec-head"><div><div class="kicker">Fresh proof</div><h2 class="hr-h2">Recently <em>verified</em></h2></div>' +
            '<a href="/hr-candidates.html">See all candidates →</a></div><div class="cand-grid" id="recentGrid">' + recent.map(H.card).join("") + "</div></section>"
        : '<section class="hr-sec"><div class="hr-state reveal"><strong>No students have shared a verified profile yet.</strong>' +
            "<span>As students pass assessments (75%+), get their environment video approved and choose to be visible to recruiters, they'll appear here automatically.</span></div></section>") +
      '<section class="hr-sec"><div class="hr-sec-head"><div><div class="kicker">Why trust it</div><h2 class="hr-h2">How Aldovra <em>verifies</em></h2></div></div>' +
        '<div class="hr-trust">' +
          '<div class="reveal"><b>01</b><strong>Proctored test</strong><span>Timed, camera-on exam with fresh questions for every attempt.</span></div>' +
          '<div class="reveal"><b>02</b><strong>75% benchmark</strong><span>Only scores of 75% or more become a verified skill.</span></div>' +
          '<div class="reveal"><b>03</b><strong>Human review</strong><span>Our team reviews the exam environment before the certificate is issued.</span></div>' +
        "</div></section>";

    var grid = document.getElementById("recentGrid");
    if (grid) grid.addEventListener("click", function (e) {
      var s = e.target.closest("[data-save]");
      if (s) {
        H.toggleSave(s.getAttribute("data-save")).then(function (on) { s.classList.toggle("on", on); s.setAttribute("aria-pressed", on); }).catch(function () {});
        return;
      }
      var o = e.target.closest("[data-open]");
      if (o) location.href = "/hr-candidates.html?open=" + encodeURIComponent(o.getAttribute("data-open"));
    });
    H.reveal(content);
  }

  H.boot("dashboard").then(function (ctx) {
    return H.loadPool({ limit: 100 }).then(function (pool) { render(ctx, pool); }, function () {
      render(ctx, []);
      H.toast("Couldn't load candidates. Please refresh.");
    });
  }).catch(function () {});
})();
</script>
</body>
</html>
