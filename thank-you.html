<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You — Aldovra</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f8fa;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 620px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 24px;
      padding: 55px 35px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
    }

    .logo {
      font-size: 30px;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 40px;
    }

    .check {
      width: 70px;
      height: 70px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #111827;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      font-weight: bold;
    }

    h1 {
      font-size: 38px;
      line-height: 1.15;
      margin-bottom: 18px;
      letter-spacing: -1px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #6b7280;
      max-width: 480px;
      margin: 0 auto 30px;
    }

    .button {
      display: inline-block;
      background: #111827;
      color: #ffffff;
      text-decoration: none;
      padding: 14px 25px;
      border-radius: 10px;
      font-weight: 700;
      transition: 0.2s;
    }

    .button:hover {
      opacity: 0.88;
    }

    .contact {
      margin-top: 30px;
      font-size: 14px;
      color: #9ca3af;
    }

    .contact a {
      color: #111827;
      text-decoration: none;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      .card {
        padding: 45px 24px;
      }

      h1 {
        font-size: 31px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="logo">Aldovra</div>

    <div class="check">✓</div>

    <h1>You're on the list. 🚀</h1>

    <p>
      Thanks for your interest in Aldovra.
      We've received your details and will be in touch soon.
    </p>

    <a href="https://aldovra.com/" class="button">
      Back to Aldovra
    </a>

    <div class="contact">
      Questions?
      <a href="mailto:helloaldovra.com@gmail.com">
        helloaldovra.com@gmail.com
      </a>
    </div>

  </div>

</body>
</html>
