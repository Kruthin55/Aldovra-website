<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verified Candidates | Aldovra HR</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0d12">
<link rel="icon" type="image/png" href="/aldovra-logo.png">
<link rel="preconnect" href="https://lgefwfrjzweayfxahogs.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/aldovra-hr.css">
</head>
<body>
<div class="hr-app">
  <main class="hr-main">
    <div class="hr-wrap">
      <section class="hr-hero">
        <div>
          <div class="kicker">Verified talent pool</div>
          <h1>Find proven <em>freshers.</em></h1>
          <p>Students who passed a proctored Aldovra assessment (75%+), got their exam environment reviewed, and chose to be visible to recruiters.</p>
        </div>
      </section>

      <div class="hr-tabs" role="tablist" aria-label="Candidate list">
        <button type="button" role="tab" class="on" data-view="all" aria-selected="true">All candidates <i id="countAll">0</i></button>
        <button type="button" role="tab" data-view="saved" aria-selected="false">Saved <i id="countSaved">0</i></button>
      </div>

      <div class="hr-filters">
        <input id="candidateSearch" type="search" placeholder="Search name, college, role or skill…" aria-label="Search candidates" autocomplete="off">
        <select id="skillFilter" aria-label="Skill"><option value="">All skills</option></select>
        <select id="roleFilter" aria-label="Career track"><option value="">All roles</option></select>
        <select id="collegeFilter" aria-label="College"><option value="">All colleges</option></select>
        <select id="sortCandidates" aria-label="Sort">
          <option value="recent">Recently verified</option>
          <option value="score">Highest score</option>
          <option value="skills">Most verified skills</option>
          <option value="name">Name A–Z</option>
        </select>
      </div>
      <p class="hr-count" id="candidateCount" role="status" aria-live="polite">Loading verified candidates…</p>

      <div class="cand-grid" id="candidateGrid">
        <div class="skel" style="height:260px"></div><div class="skel" style="height:260px"></div><div class="skel" style="height:260px"></div>
      </div>
      <div class="hr-state" id="emptyState" hidden><strong></strong><span></span></div>
      <div style="text-align:center;margin-top:20px"><button type="button" class="btn" id="loadMore" hidden>Load more verified candidates →</button></div>
    </div>
  </main>
</div>

<div class="drawer" id="talentProfileModal" aria-hidden="true"><div class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="drawerTitle"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/aldovra-hr.js"></script>
<script>
(function () {
  var H = window.AldHR, esc = H.esc;
  var $ = function (id) { return document.getElementById(id); };
  var search = $("candidateSearch"), skillSel = $("skillFilter"), roleSel = $("roleFilter"), collegeSel = $("collegeFilter"), sortSel = $("sortCandidates");
  var grid = $("candidateGrid"), empty = $("emptyState"), countEl = $("candidateCount"), more = $("loadMore");
  var drawer = $("talentProfileModal"), panel = drawer.querySelector(".drawer-panel");
  var PAGE = 100, candidates = [], offset = 0, hasMore = false, loading = false, reqNo = 0, view = "all", timer;
  var params = new URLSearchParams(location.search);
  var norm = function (v) { return String(v || "").trim().toLowerCase(); };

  function options(sel, values, label) {
    var cur = sel.value;
    sel.innerHTML = '<option value="">' + label + "</option>" + values.map(function (v) { return '<option value="' + esc(v) + '">' + esc(v) + "</option>"; }).join("");
    if (values.indexOf(cur) > -1) sel.value = cur;
  }
  function uniq(arr) { return arr.filter(function (v, i, a) { return v && a.indexOf(v) === i; }).sort(function (a, b) { return a.localeCompare(b); }); }
  function refreshOptions() {
    options(skillSel, uniq([].concat.apply([], candidates.map(function (c) { return H.skillsOf(c).map(function (s) { return String(s.name || "").trim(); }); })).concat(skillSel.value ? [skillSel.value] : [])), "All skills");
    options(roleSel, uniq(candidates.map(function (c) { return String(c.career_track || "").trim(); })), "All roles");
    options(collegeSel, uniq(candidates.map(function (c) { return String(c.college || "").trim(); })), "All colleges");
  }

  function visible() {
    var q = norm(search.value), role = norm(roleSel.value), skill = norm(skillSel.value), college = norm(collegeSel.value);
    var rows = candidates.filter(function (c) {
      var list = H.skillsOf(c);
      var text = [c.full_name, c.career_track, c.city, c.college, c.degree, list.map(function (x) { return x.name; }).join(" ")].join(" ").toLowerCase();
      return (view !== "saved" || H.isSaved(c.student_id)) && (!q || text.indexOf(q) > -1) && (!role || norm(c.career_track) === role) &&
        (!skill || list.some(function (x) { return norm(x.name) === skill; })) && (!college || norm(c.college) === college);
    });
    var s = sortSel.value;
    rows.sort(function (a, b) {
      if (s === "score") return (Number(b.average_score) || 0) - (Number(a.average_score) || 0);
      if (s === "skills") return (Number(b.verified_skill_count) || 0) - (Number(a.verified_skill_count) || 0);
      if (s === "name") return String(a.full_name || "").localeCompare(String(b.full_name || ""));
      return H.latestVerified(b) - H.latestVerified(a);
    });
    return rows;
  }

  function render() {
    var rows = visible();
    $("countAll").textContent = candidates.length + (hasMore ? "+" : "");
    $("countSaved").textContent = candidates.filter(function (c) { return H.isSaved(c.student_id); }).length;
    grid.innerHTML = rows.map(H.card).join("");
    more.hidden = !hasMore || view === "saved";
    if (!candidates.length) {
      emptyState("No students have shared a verified profile yet.", "Once a student passes a skill assessment, gets the exam environment approved and opts in to recruiter discovery, their profile appears here. No sample or non-consented profiles are shown.");
      countEl.textContent = "0 verified candidates";
    } else if (!rows.length) {
      emptyState(view === "saved" ? "Nothing saved yet" : "No candidates match these filters",
        view === "saved" ? "Tap the ⭐ on any candidate to save them here." : "Try a different skill, role, college or search.");
      countEl.textContent = "0 shown";
    } else {
      empty.hidden = true;
      countEl.textContent = rows.length + (rows.length === 1 ? " candidate" : " candidates") + (view === "saved" ? " saved" : "") + (hasMore && view !== "saved" ? " (more available)" : "");
    }
    H.reveal(grid);
  }
  function emptyState(title, text) {
    empty.hidden = false;
    empty.querySelector("strong").textContent = title;
    empty.querySelector("span").textContent = text;
  }

  function load(append) {
    if (loading) return;
    loading = true;
    var id = ++reqNo;
    if (!append) countEl.textContent = "Loading verified candidates…";
    H.loadPool({ search: search.value.trim() || null, skill: skillSel.value || null, limit: PAGE, offset: append ? offset : 0 }).then(function (rows) {
      if (id !== reqNo) return;
      candidates = append ? candidates.concat(rows) : rows;
      offset = append ? offset + rows.length : rows.length;
      hasMore = rows.length === PAGE;
      refreshOptions();
      render();
      var open = params.get("open");
      if (open) { params.delete("open"); openProfile(open); }
    }).catch(function (e) {
      console.error("Verified talent pool failed to load", e);
      candidates = []; grid.innerHTML = "";
      emptyState("Verified talent pool could not be loaded.", "Please refresh. If this keeps happening, contact support@aldovra.com.");
      countEl.textContent = "";
    }).then(function () { loading = false; });
  }

  function openProfile(id) {
    var c = candidates.find(function (x) { return String(x.student_id) === String(id); });
    if (!c) return;
    var list = H.skillsOf(c);
    var links = (H.safeUrl(c.linkedin_url) ? '<a class="btn sm" href="' + esc(H.safeUrl(c.linkedin_url)) + '" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>' : "") +
      (H.safeUrl(c.github_url) ? '<a class="btn sm" href="' + esc(H.safeUrl(c.github_url)) + '" target="_blank" rel="noopener noreferrer">GitHub ↗</a>' : "");
    var savedNow = H.isSaved(c.student_id);
    panel.innerHTML =
      '<button type="button" class="drawer-close" data-close aria-label="Close profile">×</button>' +
      '<div><span class="chip ok">✓ Opted-in verified profile</span><h2 id="drawerTitle">' + esc(c.full_name || "Aldovra student") + "</h2>" +
      '<p class="sub">' + esc([c.career_track, c.city].filter(Boolean).join(" · ") || "Early-career candidate") + "</p></div>" +
      '<div class="drawer-sec"><h3>Education</h3><p style="margin:0">' + esc([c.degree, c.college, c.graduation_year ? "Class of " + c.graduation_year : ""].filter(Boolean).join(" · ") || "Education details not added") + "</p></div>" +
      '<div class="drawer-sec"><h3>Verified skills</h3>' + list.map(function (sk) {
        return '<div class="drawer-skill"><div><b>✓ ' + esc(sk.name) + "</b><small>" + (sk.verified_at ? "Verified " + esc(new Date(sk.verified_at).toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" })) : "Verified") + "</small>" +
          (sk.certificate ? '<a href="/cert/?' + encodeURIComponent(sk.certificate) + '" target="_blank" rel="noopener">View certificate ↗</a>' : "") + "</div>" +
          '<span class="sc">' + H.pct(sk.score) + "</span></div>";
      }).join("") + "</div>" +
      (links ? '<div class="drawer-sec"><h3>Links</h3><div class="drawer-links">' + links + "</div></div>" : "") +
      '<div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn ' + (savedNow ? "" : "dark") + '" data-drawer-save="' + esc(c.student_id) + '">' + (savedNow ? "★ Saved" : "☆ Save candidate") + "</button></div>" +
      '<p class="drawer-note">This profile is visible because the student opted in. Email, phone and resume files are never shown here. Assessment results are one signal, not a guarantee of job performance.</p>';
    drawer.classList.add("open");
    drawer.setAttribute("aria-hidden", "false");
    panel.querySelector("[data-close]").focus();
  }
  function closeProfile() { drawer.classList.remove("open"); drawer.setAttribute("aria-hidden", "true"); }

  function setView(v, fromHash) {
    view = v;
    document.querySelectorAll("[data-view]").forEach(function (b) {
      var on = b.getAttribute("data-view") === v;
      b.classList.toggle("on", on); b.setAttribute("aria-selected", on);
    });
    H.setActive(v === "saved" ? "saved" : "candidates");
    if (!fromHash) history.replaceState(null, "", location.pathname + location.search + (v === "saved" ? "#saved" : ""));
    render();
  }

  function onSave(btn, id) {
    H.toggleSave(id).then(function (on) {
      document.querySelectorAll('[data-save="' + CSS.escape(String(id)) + '"]').forEach(function (b) { b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
      if (view === "saved" || btn.hasAttribute("data-drawer-save")) render();
      if (btn.hasAttribute("data-drawer-save")) openProfile(id);
      $("countSaved").textContent = candidates.filter(function (c) { return H.isSaved(c.student_id); }).length;
    }).catch(function () {});
  }

  search.addEventListener("input", function () { clearTimeout(timer); timer = setTimeout(function () { load(false); }, 300); });
  skillSel.addEventListener("change", function () { load(false); });
  [roleSel, collegeSel, sortSel].forEach(function (el) { el.addEventListener("change", render); });
  more.addEventListener("click", function () { load(true); });
  document.querySelectorAll("[data-view]").forEach(function (b) { b.addEventListener("click", function () { setView(b.getAttribute("data-view")); }); });
  addEventListener("hashchange", function () { setView(location.hash === "#saved" ? "saved" : "all", true); });
  grid.addEventListener("click", function (e) {
    var s = e.target.closest("[data-save]");
    if (s) return onSave(s, s.getAttribute("data-save"));
    var o = e.target.closest("[data-open]");
    if (o) openProfile(o.getAttribute("data-open"));
  });
  drawer.addEventListener("click", function (e) {
    if (e.target === drawer || e.target.closest("[data-close]")) return closeProfile();
    var s = e.target.closest("[data-drawer-save]");
    if (s) onSave(s, s.getAttribute("data-drawer-save"));
  });
  addEventListener("keydown", function (e) { if (e.key === "Escape") closeProfile(); });

  H.boot("candidates").then(function () {
    if (params.get("skill")) { skillSel.innerHTML += '<option value="' + esc(params.get("skill")) + '">' + esc(params.get("skill")) + "</option>"; skillSel.value = params.get("skill"); }
    if (location.hash === "#saved") setView("saved", true);
    load(false); // get_verified_candidates_for_recruiters (via AldHR.loadPool)
  }).catch(function () {});
})();
</script>
</body>
</html>
