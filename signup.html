.card {

.oauth-btn{width:100%;min-height:50px;display:flex;align-items:center;justify-content:center;gap:11px;padding:12px 16px;margin:0 0 18px;border:1px solid #ded9e8;border-radius:12px;background:#fff;color:#292536;font-size:15px;font-weight:700;cursor:pointer;transition:.2s ease}
.oauth-btn:hover{border-color:#b8a8e8;background:#fcfbff;box-shadow:0 4px 14px rgba(40,32,80,.06)}

.auth-divider{display:flex;align-items:center;gap:13px;margin:2px 0 24px;color:#8a8194;font-size:12px;font-weight:600;white-space:nowrap}

        .form-group {

        }

            display: block;

select {

}

select:focus {

    width: 100%;

    color: #ffffff;
    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
    box-shadow: 0 10px 25px rgba(79,70,229,.20);
    transition: .2s ease;
}

<body class="ald-auth" data-auth="signup">

    <header class="topbar">
        <a href="/" class="logo">
            <img src="/aldovra-logo.png" alt="Aldovra">
            <span>Aldovra</span>
        </a>

        <a href="/" class="back-link">← Back to Aldovra</a>
    </header>

    <main class="page">

        <section class="card">

            <div class="heading">
                <h1>Create your Aldovra account</h1>
                <p>
                    Join Aldovra and take the first step toward proving
                    what you can actually do.
                </p>
            </div>

            <button type="button" class="oauth-btn" id="googleSignupBtn"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18"><path fill="#4285F4" d="M21.6 12.23c0-.72-.06-1.42-.18-2.09H12v3.96h5.38a4.6 4.6 0 0 1-2 3.02v2.47h3.23c1.9-1.75 2.99-4.33 2.99-7.36Z"/><path fill="#34A853" d="M12 22c2.7 0 4.97-.9 6.62-2.41l-3.23-2.47c-.9.6-2.04.96-3.39.96-2.6 0-4.8-1.76-5.59-4.12H3.07v2.55A10 10 0 0 0 12 22Z"/><path fill="#FBBC05" d="M6.41 13.96a6 6 0 0 1 0-3.92V7.49H3.07a10 10 0 0 0 0 9.02l3.34-2.55Z"/><path fill="#EA4335" d="M12 5.92c1.47 0 2.79.5 3.83 1.52l2.87-2.87A9.6 9.6 0 0 0 12 2a10 10 0 0 0-8.93 5.49l3.34 2.55C7.2 7.68 9.4 5.92 12 5.92Z"/></svg>Continue with Google</button>
            <div class="auth-divider"><span>or create account with email</span></div>

            <form id="signupForm">

                <div class="form-group">
                    <label for="name">Full name</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap"><input type="password" id="password" placeholder="Create a strong password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-password-toggle="password" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
                    <div class="password-note">
                        Minimum 6 characters.
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm password</label>
                    <div class="password-wrap"><input type="password" id="confirmPassword" placeholder="Re-enter your password" autocomplete="new-password" minlength="6" required><button class="password-toggle" type="button" data-password-toggle="confirmPassword" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div>
                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="signupBtn"
                >
                    Create Account
                </button>

                <div id="message" class="message"></div>

            </form>

            <div class="login-text">
                Already have an account?
                <a href="/login.html">Log in</a>
            </div>

            <div class="footer-note">
                Aldovra · Skills Verified. Better Hiring.
            </div>

        </section>

    </main>

    <script>
const SUPABASE_URL = "https://lgefwfrjzweayfxahogs.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_f4DHvfDfjqLyugXm6iq6JQ__Q72vK9i";

const { createClient } = window.supabase;

const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

document.getElementById("googleSignupBtn").addEventListener("click", async function () {
  const button = this;
  button.disabled = true;
  button.textContent = "Connecting to Google...";
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/dashboard.html" },
    });
    if (error) throw error;
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Google sign-in could not start. Please try email registration.", "error");
    button.disabled = false;
    button.textContent = "Continue with Google";
  }
});

document.querySelectorAll("[data-password-toggle]").forEach((toggle) => {
  toggle.addEventListener("click", () => {
    const input = document.getElementById(toggle.dataset.passwordToggle);
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    toggle.setAttribute("aria-label", showing ? "Show password" : "Hide password");
    toggle.setAttribute("aria-pressed", String(!showing));
  });
});

const form = document.getElementById("signupForm");
const signupBtn = document.getElementById("signupBtn");
const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

form.addEventListener("submit", async function (event) {
  event.preventDefault();
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  const role = "student";
  message.className = "message";
  message.textContent = "";
  if (password !== confirmPassword) {
    showMessage("Passwords do not match. Please check again.", "error");
    return;
  }
  if (password.length < 6) {
    showMessage("Password must contain at least 6 characters.", "error");
    return;
  }
  signupBtn.disabled = true;
  signupBtn.textContent = "Creating account...";
  try {
    const { data, error } = await supabaseClient.auth.signUp({
      email: email,
      password: password,
      options: {
        data: {
          full_name: name,
          role: role,
        },
      },
    });
    if (error) {
      throw error;
    }
    showMessage(
      "Account created successfully! Please check your email and verify your account before logging in.",
      "success",
    );
    form.reset();
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Something went wrong. Please try again.", "error");
  } finally {
    signupBtn.disabled = false;
    signupBtn.textContent = "Create Account";
  }
});
</script>
