<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In — Aldovra</title>

    <meta name="description"
          content="Log in to your Aldovra account.">

    <link rel="icon" type="image/png" href="/aldovra-logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

       body {
    font-family: Inter, Arial, sans-serif;
    min-height: 100vh;
    background: #fbfaf7;
    color: #171725;
    display: flex;
    flex-direction: column;
}

        .topbar {
            width: 100%;
            padding: 22px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
           color: #171725;
            font-size: 22px;
            font-weight: 800;
        }

        .logo img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 10px;
        }

        .back-link {
            text-decoration: none;
            color: #747487;
            font-size: 14px;
            font-weight: 600;
        }
.back-link:hover {
    color: #4338ca;
}
        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 60px;
        }

       .card {
    width: 100%;
    max-width: 470px;
    background: #ffffff;
    border: 1px solid #e8e5ef;
    border-radius: 24px;
    padding: 42px;
    box-shadow: 0 20px 60px rgba(40,32,80,.10);
}
        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 31px;
            line-height: 1.2;
            margin-bottom: 10px;
            letter-spacing: -.8px;
        }

        .heading p {
           color: #747487;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
         color: #3f3f50;
        }

        input {
            width: 100%;
            height: 50px;
           border: 1px solid #e8e5ef;
            border-radius: 12px;
            padding: 0 15px;
           background: #ffffff;
            color: #171725;
            font-size: 15px;
            outline: none;
            transition: .2s ease;
        }

      input:focus {
    border-color: #4f46e5;
    box-shadow: 0 0 0 4px rgba(79,70,229,.10);
}

        .password-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .password-row label {
            margin-bottom: 0;
        }

        .forgot {
            font-size: 12px;
            color: #7c3aed;
            text-decoration: none;
            font-weight: 700;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            margin-top: 8px;
         background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
           box-shadow: 0 10px 25px rgba(79,70,229,.20);
            transition: .2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 13px 30px rgba(79,70,229,.28);
        }

        .submit-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px 15px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

       .message.success {
    display: block;
    background: #ecfdf3;
    border: 1px solid #bbf7d0;
    color: #166534;
}

        .message.error {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .signup-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #747487;
        }

       .signup-text a {
    color: #7c3aed;
            text-decoration: none;
            font-weight: 800;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #968ba0;
        }

        @media (max-width: 600px) {

            .topbar {
                padding: 18px 20px;
            }

            .logo {
                font-size: 19px;
            }

            .logo img {
                width: 36px;
                height: 36px;
            }

            .page {
                padding: 15px 16px 40px;
                align-items: flex-start;
            }

            .card {
                margin-top: 15px;
                padding: 28px 20px;
                border-radius: 20px;
            }

            .heading h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="/" class="logo">
            <img src="/aldovra-logo.png" alt="Aldovra">
            <span>Aldovra</span>
        </a>

        <a href="/" class="back-link">
            ← Back to Aldovra
        </a>

    </header>

    <main class="page">

        <section class="card">

            <div class="heading">
                <h1>Welcome back</h1>
                <p>
                    Log in to continue your Aldovra journey
                    and prove what you can do.
                </p>
            </div>

            <form id="loginForm">

                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>

                <div class="form-group">

                    <div class="password-row">

                        <label for="password">
                            Password
                        </label>

                        <a href="#" class="forgot" id="forgotPassword">
                            Forgot password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="loginBtn"
                >
                    Log In
                </button>

                <div id="message" class="message"></div>

            </form>

            <div class="signup-text">
                Don't have an account?
                <a href="/signup.html">Create one</a>
            </div>

            <div class="footer-note">
                Aldovra · Skills Verified. Better Hiring.
            </div>

        </section>

    </main>

    <script>

        const SUPABASE_URL =
            "https://lgefwfrjzweayfxahogs.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_f4DHvfDfjqLyugXm6iq6JQ__Q72vK9i";

        const { createClient } = window.supabase;

        const supabaseClient = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const form =
            document.getElementById("loginForm");

        const loginBtn =
            document.getElementById("loginBtn");

        const message =
            document.getElementById("message");

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;
        }

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email =
                document.getElementById("email")
                    .value
                    .trim();

            const password =
                document.getElementById("password")
                    .value;

            message.className = "message";
            message.textContent = "";

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";

            try {

                const { data, error } =
                    await supabaseClient.auth
                        .signInWithPassword({
                            email: email,
                            password: password
                        });

                if (error) {
                    throw error;
                }

                showMessage(
                    "Login successful! Redirecting...",
                    "success"
                );

                setTimeout(function() {

                    window.location.href =
                        "/dashboard.html";

                }, 800);

            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Unable to log in. Please check your details.",
                    "error"
                );

            } finally {

                loginBtn.disabled = false;
                loginBtn.textContent = "Log In";

            }

        });

        document
            .getElementById("forgotPassword")
            .addEventListener("click", async function(event) {

                event.preventDefault();

                const email =
                    document.getElementById("email")
                        .value
                        .trim();

                if (!email) {

                    showMessage(
                        "Enter your email address first.",
                        "error"
                    );

                    return;
                }

                try {

                    const { error } =
                        await supabaseClient.auth
                            .resetPasswordForEmail(
                                email,
                                {
                                    redirectTo:
                                        "https://aldovra.com/reset-password.html"
                                }
                            );

                    if (error) {
                        throw error;
                    }

                    showMessage(
                        "Password reset email sent. Please check your inbox.",
                        "success"
                    );

                } catch (error) {

                    showMessage(
                        error.message ||
                        "Unable to send reset email.",
                        "error"
                    );

                }

            });

    </script>

</body>
</html>
