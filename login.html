    <script>
const SUPABASE_URL = "https://lgefwfrjzweayfxahogs.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_f4DHvfDfjqLyugXm6iq6JQ__Q72vK9i";

const { createClient } = window.supabase;

const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

document.getElementById("googleLoginBtn").addEventListener("click", async function () {
  const button = this;
  button.disabled = true;
  button.textContent = "Connecting to Google...";
  try {
    const { error } = await supabaseClient.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + "/dashboard.html" },
    });
    if (error) throw error;
  } catch (error) {
    console.error(error);
    showMessage(friendlyAuthError(error, "Google sign-in could not start. Please try email login."), "error");
    button.disabled = false;
    button.textContent = "Continue with Google";
  }
});

const form = document.getElementById("loginForm");

const loginBtn = document.getElementById("loginBtn");

const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

(function showNoticeFromLink() {
  let notice = "";
  try { notice = new URLSearchParams(location.search).get("notice") || ""; } catch (e) {}
  if (!notice) return;
  const text = /otp_expired/i.test(notice)
    ? "That email link was already used or has expired. If you already verified, just log in below. Not verified yet? Log in and we\u2019ll send you a fresh link."
    : "That email link didn\u2019t work. Please log in below, or request a new link.";
  const box = document.createElement("div");
  box.className = "message info link-notice";
  box.setAttribute("role", "status");
  box.textContent = text;
  const google = document.getElementById("googleLoginBtn");
  google.parentNode.insertBefore(box, google);
  history.replaceState(null, "", location.pathname);
})();

function friendlyAuthError(error, fallback) {
  const code = (error && (error.code || "")) + " " + ((error && error.message) || "");
  const wait = /(\d+)\s*seconds?/.exec(code);
  if (/over_email_send_rate_limit|rate limit|only request this after/i.test(code)) {
    return wait
      ? "Too many emails in a short time. Please wait " + wait[1] + " seconds and try again."
      : "Too many emails in a short time. Please wait a minute and try again.";
  }
  if (/email_not_confirmed|not confirmed/i.test(code)) return "Please verify your email first. We can send you a fresh verification link.";
  if (/invalid_credentials|invalid login/i.test(code)) return "Email or password is wrong. Try again, or use “Forgot password?”.";
  if (/user_already_exists|already registered/i.test(code)) return "This email already has an account. Please log in, or continue with Google.";
  if (/weak_password/i.test(code)) return "Please choose a stronger password (at least 6 characters, mix letters and numbers).";
  if (/email_address_invalid|invalid.*email/i.test(code)) return "Please enter a valid email address.";
  if (/Failed to fetch|NetworkError/i.test(code)) return "Network problem. Check your internet and try again.";
  return (error && error.message) || fallback;
}

function showResend(email) {
  let row = document.getElementById("resendRow");
  if (!row) {
    row = document.createElement("div");
    row.id = "resendRow";
    row.className = "resend-row";
    row.innerHTML = '<span>Didn’t get the email? Check Spam/Promotions, then</span> <button type="button" class="resend-btn">Resend verification email</button>';
    message.insertAdjacentElement("afterend", row);
  }
  const btn = row.querySelector("button");
  btn.onclick = async function () {
    btn.disabled = true;
    btn.textContent = "Sending...";
    try {
      const { error } = await supabaseClient.auth.resend({
        type: "signup",
        email: email,
        options: { emailRedirectTo: window.location.origin + "/dashboard.html" },
      });
      if (error) throw error;
      showMessage("New verification link sent to " + email + ". It can take a minute; check Spam too.", "success");
      let left = 60;
      const t = setInterval(function () {
        btn.textContent = "Resend again in " + left-- + "s";
        if (left < 0) { clearInterval(t); btn.disabled = false; btn.textContent = "Resend verification email"; }
      }, 1000);
    } catch (error) {
      showMessage(friendlyAuthError(error, "Could not resend the email. Please try again."), "error");
      btn.disabled = false;
      btn.textContent = "Resend verification email";
    }
  };
}

form.addEventListener("submit", async function (event) {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  message.className = "message";
  message.textContent = "";
  loginBtn.disabled = true;
  loginBtn.textContent = "Logging in...";
  try {
    const { data, error } = await supabaseClient.auth.signInWithPassword({
      email: email,
      password: password,
    });
    if (error) {
      throw error;
    }
    showMessage("Login successful! Redirecting...", "success");
    setTimeout(function () {
      window.location.href = "/dashboard.html";
    }, 800);
  } catch (error) {
    console.error(error);
    showMessage(friendlyAuthError(error, "Unable to log in. Please check your details."), "error");
    if (/email_not_confirmed|not confirmed/i.test((error.code || "") + " " + (error.message || ""))) showResend(email);
  } finally {
    loginBtn.disabled = false;
    loginBtn.textContent = "Log In";
  }
});

document.getElementById("forgotPassword").addEventListener("click", async function (event) {
  event.preventDefault();
  const email = document.getElementById("email").value.trim();
  if (!email) {
    showMessage("Enter your email address first.", "error");
    return;
  }
  try {
    const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
      redirectTo: "https://aldovra.com/reset-password.html",
    });
    if (error) {
      throw error;
    }
    showMessage("If " + email + " has an Aldovra account, a reset link is on its way. Check Spam/Promotions too.", "success");
  } catch (error) {
    showMessage(friendlyAuthError(error, "Unable to send reset email."), "error");
  }
});
</script>
