name: Aldovra Static Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  dashboard-inline-js:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check dashboard inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.external = False
                  self.parts = []
                  self.scripts = []

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.in_script = True
                      self.external = any(k.lower() == "src" for k, _ in attrs)
                      self.parts = []

              def handle_data(self, data):
                  if self.in_script:
                      self.parts.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_script:
                      if not self.external:
                          self.scripts.append("".join(self.parts))
                      self.in_script = False
                      self.external = False
                      self.parts = []

          path = Path("dashboard.html")
          html = path.read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(html)
          parser.close()

          if not parser.scripts:
              raise SystemExit("No inline JavaScript blocks found in dashboard.html")
          if html.lower().count("<script") != html.lower().count("</script>"):
              raise SystemExit("Unbalanced script tags in dashboard.html")

          for index, script in enumerate(parser.scripts, start=1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8") as tmp:
                  tmp.write(script)
                  tmp.flush()
                  result = subprocess.run(
                      ["node", "--check", tmp.name],
                      text=True,
                      capture_output=True,
                  )
                  if result.returncode:
                      print(f"Inline script {index} failed syntax validation:")
                      print(result.stdout)
                      print(result.stderr)
                      raise SystemExit(result.returncode)

          print(f"JavaScript syntax passed for {len(parser.scripts)} inline script blocks.")
          PY
