name: Aldovra static checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/**"]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate inline JavaScript and page metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          pages = ["index.html", "dashboard.html", "assessment.html", "career-agent.html"]

          class ScriptParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.scripts = []
                  self.current = None
                  self.current_attrs = {}

              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "script":
                      self.current_attrs = dict(attrs)
                      self.current = [] if "src" not in self.current_attrs else None

              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      source = "".join(self.current).strip()
                      if source:
                          self.scripts.append((self.current_attrs.get("type", ""), source))
                      self.current = None
                      self.current_attrs = {}

          failures = []
          for page in pages:
              path = Path(page)
              if not path.is_file():
                  failures.append(f"{page}: file missing")
                  continue
              html = path.read_text(encoding="utf-8")
              parser = ScriptParser()
              parser.feed(html)
              for number, (script_type, source) in enumerate(parser.scripts, 1):
                  suffix = ".mjs" if script_type == "module" else ".js"
                  with tempfile.NamedTemporaryFile("w", suffix=suffix, encoding="utf-8") as tmp:
                      tmp.write(source)
                      tmp.flush()
                      result = subprocess.run(
                          ["node", "--check", tmp.name],
                          text=True,
                          capture_output=True,
                      )
                  if result.returncode:
                      failures.append(f"{page} inline script {number}: {result.stderr.strip()}")
              normalized_html = " ".join(html.lower().split())
              if '<meta name="description"' not in normalized_html:
                  failures.append(f"{page}: missing meta description")
              if page != "index.html" and '<meta name="robots"' not in normalized_html:
                  failures.append(f"{page}: missing robots directive")
              print(f"Checked {page}: {len(parser.scripts)} inline script(s)")

          if failures:
              print("\n".join(failures))
              raise SystemExit(1)
          # Guard agreed assessment settings and server-side verification rules.
          invariant_checks = {
              "index.html": [
                  'rel="canonical" href="https://aldovra.com/"',
                  'property="og:url" content="https://aldovra.com/"',
                  'property="og:image" content="https://aldovra.com/aldovra-logo.png"',
              ],
              "assessment.html": [
                  "details.duration_minutes||20",
                  "details.question_count||30",
                  "payload.duration_minutes||",
              ],
              "supabase/functions/generate-assessment/index.ts": [
                  "Number(details?.question_count) || 30",
                  "Number(details?.duration_minutes) || 20",
                  'options: q.options',
              ],
              "supabase/functions/submit-assessment/index.ts": [
                  "ASSESSMENT_SESSION_EXPIRED",
                  "percentage >= 75",
                  'status: "verified"',
                  'onConflict: "user_id,skill_id"',
              ],
              "supabase/migrations/20261011070000_align_assessment_duration_and_pass_threshold.sql": [
                  "duration_minutes = 20",
                  "passing_score = 75",
              ],
              "supabase/migrations/20261011071000_set_assessment_request_defaults_to_30_questions_20_minutes.sql": [
                  "question_count SET DEFAULT 30",
                  "duration_minutes SET DEFAULT 20",
              ],
          }

          for filename, required_markers in invariant_checks.items():
              path = Path(filename)
              if not path.is_file():
                  failures.append(f"{filename}: required release file missing")
                  continue
              source = path.read_text(encoding="utf-8")
              for marker in required_markers:
                  if marker not in source:
                      failures.append(f"{filename}: missing expected invariant {marker!r}")

          if failures:
              print("\\n".join(failures))
              raise SystemExit(1)
          print("Assessment configuration and verification invariants passed.")
          print("Aldovra static checks passed.")
          PY
