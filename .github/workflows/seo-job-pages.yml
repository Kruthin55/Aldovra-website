name: SEO job pages

# Rebuilds the public, crawlable /jobs/ pages (city + role + /jobs/today/ share kit) and sitemap.xml from the live feed
# (anon RPC public_jobs_feed) every morning, and commits only when something changed.
# Push from this workflow deploys GitHub Pages as usual.
on:
  schedule:
    # GitHub often starts scheduled runs hours late or skips them (19 Nov 2026: no 06:47 run at all),
    # so there are backup times; Telegram posts only once per IST day (see data/telegram-last-post.txt).
    # 20 Nov 2026: none of the three morning runs started, so Supabase pg_cron also dispatches this workflow
    # with daily=true (cron jobs aldovra-seo-dispatch-*, migration 20261120110000_seo_dispatch_cron.sql).
    - cron: "17 1 * * *"   # 06:47 IST
    - cron: "47 2 * * *"   # 08:17 IST backup
    - cron: "17 4 * * *"   # 09:47 IST backup
    - cron: "47 6 * * *"   # 12:17 IST backup
  workflow_dispatch:
    inputs:
      telegram:
        description: "Also post today's list to Telegram (scheduled runs post once per day)"
        type: boolean
        default: false
      daily:
        description: "Daily run from Supabase pg_cron (acts like a scheduled run: posts to Telegram at most once per IST day)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: seo-job-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build job pages
        run: node tools/build-job-pages.mjs
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A jobs job sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "aldovra-bot"
          git config user.email "aldovra-bot@users.noreply.github.com"
          git commit -m "Daily job pages refresh"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Post today's picks to Telegram (only when the secrets exist)
        # once a day from the scheduled run; manual runs post only when asked, so rebuilds never double-post
        if: github.event_name == 'schedule' || inputs.telegram || inputs.daily
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHANNEL:-}" ]; then echo "Telegram not set up; skipping."; exit 0; fi
          today=$(TZ=Asia/Kolkata date +%F)
          git pull -q --rebase origin main || true
          if { [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.daily }}" = "true" ]; } && [ "$(cat data/telegram-last-post.txt 2>/dev/null)" = "$today" ]; then
            echo "Already posted to Telegram today ($today); skipping."; exit 0
          fi
          python3 - <<'PY'
          import html, json, os, re, urllib.request, urllib.parse, pathlib
          page = pathlib.Path("jobs/today/index.html").read_text(encoding="utf-8")
          m = re.search(r'<textarea id="tdCaption"[^>]*>(.*?)</textarea>', page, re.S)
          if not m: raise SystemExit("caption not found")
          text = html.unescape(m.group(1)).strip()
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHANNEL"], "text": text, "disable_web_page_preview": "false"}).encode()
          try:
              r = urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", data, timeout=20)
              ok = json.loads(r.read()).get("ok")
              print("Telegram:", ok)
              if ok: pathlib.Path("/tmp/tg_ok").write_text("1")
          except Exception as e:
              print("Telegram post failed (not fatal):", e)
          PY
          if [ -f /tmp/tg_ok ]; then
            mkdir -p data && echo "$today" > data/telegram-last-post.txt
            git config user.name "aldovra-bot"
            git config user.email "aldovra-bot@users.noreply.github.com"
            git add data/telegram-last-post.txt
            git commit -q -m "Telegram posted $today" && (git pull -q --rebase origin main; git push -q origin HEAD:main) || true
          fi
      - name: Tell Bing / IndexNow which pages changed
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -uo pipefail
          sleep 90   # give GitHub Pages time to publish the new files
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<loc>//;s/<\/loc>//' | grep -E '/$|/jobs/' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"aldovra.com","key":"237b7a3aea9799a4a9af614a829e7ae4","keyLocation":"https://aldovra.com/237b7a3aea9799a4a9af614a829e7ae4.txt","urlList":%s}' "$urls")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow HTTP $code"   # 200/202 = accepted; never fail the job on this
