name: SEO job pages

# Rebuilds the public, crawlable /jobs/ pages (city + role + /jobs/today/ share kit) and sitemap.xml from the live feed
# (anon RPC public_jobs_feed) every morning, and commits only when something changed.
# Push from this workflow deploys GitHub Pages as usual.
on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-job-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build job pages
        run: node tools/build-job-pages.mjs
      - name: Commit if changed
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git add -A jobs job sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "aldovra-bot"
          git config user.email "aldovra-bot@users.noreply.github.com"
          git commit -m "Daily job pages refresh"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=1" >> "$GITHUB_OUTPUT"
      - name: Post today's picks to Telegram (only when the secrets exist)
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
        shell: bash
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHANNEL:-}" ]; then echo "Telegram not set up; skipping."; exit 0; fi
          python3 - <<'PY'
          import html, json, os, re, urllib.request, urllib.parse, pathlib
          page = pathlib.Path("jobs/today/index.html").read_text(encoding="utf-8")
          m = re.search(r'<textarea id="tdCaption"[^>]*>(.*?)</textarea>', page, re.S)
          if not m: raise SystemExit("caption not found")
          text = html.unescape(m.group(1)).strip()
          data = urllib.parse.urlencode({"chat_id": os.environ["TELEGRAM_CHANNEL"], "text": text, "disable_web_page_preview": "false"}).encode()
          try:
              r = urllib.request.urlopen(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage", data, timeout=20)
              print("Telegram:", json.loads(r.read()).get("ok"))
          except Exception as e:
              print("Telegram post failed (not fatal):", e)
          PY
      - name: Tell Bing / IndexNow which pages changed
        if: steps.commit.outputs.changed == '1' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -uo pipefail
          sleep 90   # give GitHub Pages time to publish the new files
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed 's/<loc>//;s/<\/loc>//' | grep -E '/$|/jobs/' | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          body=$(printf '{"host":"aldovra.com","key":"237b7a3aea9799a4a9af614a829e7ae4","keyLocation":"https://aldovra.com/237b7a3aea9799a4a9af614a829e7ae4.txt","urlList":%s}' "$urls")
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          echo "IndexNow HTTP $code"   # 200/202 = accepted; never fail the job on this
