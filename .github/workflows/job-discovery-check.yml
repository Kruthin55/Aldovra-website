name: Student job discovery static check

on:
  pull_request:
    paths:
      - "supabase/functions/student-job-discovery/**"
      - ".github/workflows/job-discovery-check.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/student-job-discovery/**"
      - ".github/workflows/job-discovery-check.yml"

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check student job discovery function
        run: deno check supabase/functions/student-job-discovery/index.ts
