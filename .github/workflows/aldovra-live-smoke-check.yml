name: Aldovra Live Smoke Check

on:
  schedule:
    # Run hourly so public-site regressions are detected without manual checks.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aldovra-live-smoke-check
  cancel-in-progress: true

jobs:
  public-site:
    name: Check public site and mobile layout
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check homepage HTTP response
        shell: bash
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          status="$(curl --silent --show-error --location \
            --connect-timeout 10 --max-time 30 \
            --output "$body_file" --write-out '%{http_code}' \
            https://aldovra.com/)"
          echo "Homepage HTTP status: $status"
          if [[ "$status" != "200" ]]; then
            echo "::error::Aldovra homepage returned HTTP $status"
            head -c 1000 "$body_file" || true
            exit 1
          fi
          if ! grep -Eiq 'Aldovra|Skills Verified|Better Hiring' "$body_file"; then
            echo "::error::Homepage returned HTTP 200 but expected Aldovra page markers were not found"
            exit 1
          fi
          echo "Homepage response and basic content marker passed."

      - name: Verify TLS and redirect destination
        shell: bash
        run: |
          set -euo pipefail
          final_url="$(curl --silent --show-error --location --max-time 30 \
            --output /dev/null --write-out '%{url_effective}' https://aldovra.com/)"
          echo "Final URL: $final_url"
          case "$final_url" in
            https://aldovra.com/*|https://www.aldovra.com/*) ;;
            *)
              echo "::error::Homepage redirected to an unexpected destination: $final_url"
              exit 1
              ;;
          esac

      - name: Set up Node.js for browser checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Test homepage, mobile overflow, and dashboard document
        env:
          ALDOVRA_BASE_URL: https://aldovra.com
        run: npx playwright test tests/site-smoke.spec.js --reporter=line
