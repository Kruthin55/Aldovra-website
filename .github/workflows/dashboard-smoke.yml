name: Dashboard smoke checks

on:
  pull_request:
    paths:
      - "dashboard.html"
      - "assets/dashboard/**"
      - "admin.html"
      - "hr-candidates.html"
      - "hr-login.html"
      - "supabase/functions/sync-job-sources/index.ts"
      - "supabase/migrations/**"
      - ".github/workflows/dashboard-smoke.yml"
  push:
    branches: [main]
    paths:
      - "dashboard.html"
      - "assets/dashboard/**"
      - ".github/workflows/dashboard-smoke.yml"
  workflow_dispatch:

jobs:
  inline-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Syntax-check inline JavaScript
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class Scripts(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.current = None
                  self.items = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  src = attrs.get("src")
                  kind = (attrs.get("type") or "text/javascript").lower()
                  if not src and (kind in ("text/javascript", "application/javascript", "module", "text/ecmascript", "application/ecmascript")):
                      self.current = []
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      source = "".join(self.current)
                      if source.strip():
                          self.items.append(source)
                      self.current = None

          html_files = ["dashboard.html", "admin.html", "hr-candidates.html", "hr-login.html"]
          failures = []
          total_scripts = 0
          with tempfile.TemporaryDirectory() as temp:
              for filename in html_files:
                  parser = Scripts()
                  parser.feed(Path(filename).read_text(encoding="utf-8"))
                  if filename == "dashboard.html":
                      parser.items.extend(p.read_text(encoding="utf-8") for p in sorted(Path("assets/dashboard").glob("*.js")))
                  if not parser.items:
                      raise SystemExit(f"No inline JavaScript blocks found in {filename}.")
                  for index, source in enumerate(parser.items, 1):
                      total_scripts += 1
                      path = Path(temp) / f"{Path(filename).stem}-inline-{index}.mjs"
                      path.write_text(source, encoding="utf-8")
                      result = subprocess.run(["node", "--check", str(path)], capture_output=True, text=True)
                      if result.returncode:
                          failures.append(f"{filename} inline script #{index}:\n{result.stderr}")
          if failures:
              raise SystemExit("\n".join(failures))
          print(f"Syntax OK: {total_scripts} inline JavaScript blocks across {len(html_files)} pages.")
          PY
      - name: Check core job workflow markers
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("dashboard.html").read_text(encoding="utf-8") + "".join(
              p.read_text(encoding="utf-8") for p in sorted(Path("assets/dashboard").glob("*")))
          required = {
              "resume and verified-skill matching": "verifiedExamSkills",
              "fresher/internship classification": "jobEligibility",
              "India location prioritization": "locationPriority",
              "environment video pending gate": "Environment Video Pending",
              "YouTube evidence submission": "submit-environment-video-link",
              "YouTube evidence link card": "ald-env-link-card",

              "skill-gap explanation": "not found in your resume",
              "save job action": "data-ald-save",
              "mark-applied action": "data-ald-mark-applied",
              "skill-gap learning plan": "aldovra-learning-plan",
              "application pipeline analytics": "renderTrackerInsights",
              "application analytics UI": "aldApplicationInsights",
              "Premium Verified sidebar": 'data-section="premium-verified"',
              "Premium Verified section": 'id="premiumVerifiedSection"',
              "Premium profile status": "verifiedJobSearchStatus",
              "Verified Matches job tab": 'data-ald-job-tab="verified"',
              "Verified job-match explanation": "Why this is a verified match",
              "Verified profile skill mapping": "assessments(title,skill_id,skills(name))",
              "Verified job-search controller": "ald-verified-job-search-controller",
              "match scoring evidence calculation": "verifiedEvidence",
              "scoped experience requirement matching": "qualificationText",
              "Verified assessment title normalization": "Fundamentals\\s+)?Assessment",
              "Missing-college report input": "aldMissingCollegeName",
              "Application college picker guidance": "Lever University Picker",
              "Application college free-text fallback": "select an exact match only",
          }
          missing = [label for label, marker in required.items() if marker not in source]
          if missing:
              raise SystemExit("Missing core job workflow markers: " + ", ".join(missing))
          obsolete = {
              "generic resume tailoring studio": "ald-resume-tailoring-studio",
              "generic resume-fit panel": "ald-resume-fit-inline",
          }
          present = [label for label, marker in obsolete.items() if marker in source]
          if present:
              raise SystemExit("Removed generic resume advice unexpectedly present: " + ", ".join(present))
          if "environmentVideoSection" in source or "uploadEnvironmentVideo" in source:
              raise SystemExit("Legacy raw environment-video upload UI/function must stay removed.")
          admin_source = Path("admin.html").read_text(encoding="utf-8")
          for label, marker in {
              "admin job issue review queue": "jobApplicationIssuesList",
              "admin report status actions": "data-job-issue-update",
              "sync deactivated job count": "result.deactivated",
          }.items():
              if marker not in admin_source:
                  raise SystemExit(f"Missing {label} marker: {marker}")

          recruiter_source = Path("hr-candidates.html").read_text(encoding="utf-8")
          recruiter_login_source = Path("hr-login.html").read_text(encoding="utf-8")
          for label, marker, haystack in [
              ("live verified talent pool RPC", "get_verified_candidates_for_recruiters", recruiter_source),
              ("approved recruiter login gate", "signInWithPassword", recruiter_login_source),
              ("no placeholder recruiter cards", "No students have shared a verified profile yet.", recruiter_source),
          ]:
              if marker not in haystack:
                  raise SystemExit(f"Missing {label} marker: {marker}")

          sync_source = Path("supabase/functions/sync-job-sources/index.ts").read_text(encoding="utf-8")
          for label, marker in {
              "live feed reconciliation": "reconcile_job_source_feed",
              "complete snapshot guard": "feedComplete",
              "SmartRecruiters pagination": "totalFound",
              "Lever pagination": "?mode=json&skip=",
          }.items():
              if marker not in sync_source:
                  raise SystemExit(f"Missing {label} marker: {marker}")
          print("Student application guidance, issue reports, live-feed reconciliation and recruiter guards OK.")
          PY
