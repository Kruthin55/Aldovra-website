<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Aldovra Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>

    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;

      --primary: #6d28d9;
      --primary-dark: #5b21b6;

      --success: #15803d;
      --success-bg: #dcfce7;

      --warning: #c2410c;
      --warning-bg: #ffedd5;

      --danger: #dc2626;
      --danger-bg: #fee2e2;
    }


    * {
      box-sizing: border-box;
    }


    body {
      margin: 0;

      font-family:
        Arial,
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }


    button,
    input,
    textarea,
    select {
      font: inherit;
    }


    button {
      cursor: pointer;
    }


    .topbar {
      height: 70px;

      background: var(--surface);

      border-bottom:
        1px solid var(--border);

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      padding: 0 28px;

      position: sticky;

      top: 0;

      z-index: 100;
    }


    .brand {
      font-size: 22px;
      font-weight: 800;
    }


    .admin-label {
      color: var(--muted);
      font-size: 14px;
    }


    .container {
      max-width: 1150px;

      margin: auto;

      padding:
        40px 20px 70px;
    }


    h1 {
      margin:
        0 0 8px;

      font-size: 30px;
    }


    .subtitle {
      color: var(--muted);

      margin-bottom: 30px;
    }


    .stats {
      display: grid;

      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );

      gap: 15px;

      margin-bottom: 28px;
    }


    .stat-card {
      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 16px;

      padding: 20px;
    }


    .stat-number {
      font-size: 28px;

      font-weight: 800;

      margin-bottom: 5px;
    }


    .stat-label {
      color: var(--muted);

      font-size: 13px;
    }


    .request-card {
      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 18px;

      padding: 22px;

      margin-bottom: 16px;
    }


    .request-top {
      display: flex;

      justify-content:
        space-between;

      gap: 20px;

      align-items:
        flex-start;
    }


    .assessment-name {
      font-size: 19px;

      font-weight: 700;

      margin-bottom: 8px;
    }


    .student-info {
      color: var(--muted);

      line-height: 1.7;

      font-size: 14px;
    }


    .status {
      display: inline-block;

      padding:
        6px 11px;

      border-radius: 999px;

      font-size: 11px;

      font-weight: 800;

      text-transform:
        uppercase;
    }


    .status-pending {
      background:
        var(--warning-bg);

      color:
        var(--warning);
    }


    .status-approved {
      background: #ede9fe;

      color:
        var(--primary);
    }


    .status-rejected {
      background:
        var(--danger-bg);

      color:
        var(--danger);
    }


    .status-completed {
      background:
        var(--success-bg);

      color:
        var(--success);
    }


    .actions {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;

      margin-top: 18px;
    }


    .btn {
      border: none;

      border-radius: 10px;

      padding:
        10px 15px;

      font-weight: 700;
    }


    .btn-primary {
      background:
        var(--primary);

      color: white;
    }


    .btn-primary:hover {
      background:
        var(--primary-dark);
    }


    .btn-secondary {
      background:
        transparent;

      color:
        var(--text);

      border:
        1px solid var(--border);
    }


    .btn-success {
      background:
        var(--success);

      color: white;
    }


    .btn-danger {
      background:
        var(--danger);

      color: white;
    }


    .email-sent {
      font-size: 12px;

      color:
        var(--success);

      font-weight: 700;

      margin-top: 10px;
    }


    .empty {
      background:
        var(--surface);

      border:
        1px solid var(--border);

      border-radius: 18px;

      padding: 35px;

      text-align: center;

      color: var(--muted);
    }


    .error {
      color:
        var(--danger);
    }


    /* MODAL */

    .modal-backdrop {
      position: fixed;

      inset: 0;

      background:
        rgba(0,0,0,0.55);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 1000;
    }


    .modal {
      width: 100%;

      max-width: 680px;

      max-height: 92vh;

      overflow-y: auto;

      background:
        var(--surface);

      border-radius: 20px;

      padding: 26px;

      box-shadow:
        0 25px 80px
        rgba(0,0,0,0.25);
    }


    .modal-header {
      display: flex;

      justify-content:
        space-between;

      gap: 20px;

      margin-bottom: 24px;
    }


    .modal-title {
      font-size: 23px;

      font-weight: 800;
    }


    .close-btn {
      border: none;

      background:
        transparent;

      font-size: 25px;

      color:
        var(--muted);
    }


    .field {
      margin-bottom: 17px;
    }


    .field label {
      display: block;

      margin-bottom: 7px;

      font-size: 13px;

      font-weight: 700;
    }


    .field input,
    .field textarea,
    .field select {

      width: 100%;

      padding:
        11px 12px;

      border:
        1px solid var(--border);

      border-radius: 10px;

      background:
        var(--surface);

      color:
        var(--text);

      outline: none;
    }


    .field textarea {
      min-height: 110px;

      resize: vertical;
    }


    .field input:focus,
    .field textarea:focus,
    .field select:focus {

      border-color:
        var(--primary);
    }


    .grid-2 {

      display: grid;

      grid-template-columns:
        repeat(
          2,
          minmax(0, 1fr)
        );

      gap: 14px;
    }


    .modal-actions {

      display: flex;

      justify-content:
        space-between;

      gap: 10px;

      margin-top: 25px;
    }


    .left-actions,
    .right-actions {

      display: flex;

      gap: 10px;
    }


    .info-box {

      background:
        #f8f7ff;

      border:
        1px solid #e9e3ff;

      border-radius: 12px;

      padding: 14px;

      margin-bottom: 20px;

      line-height: 1.6;

      font-size: 13px;
    }


    @media (max-width: 700px) {

      .stats {
        grid-template-columns: 1fr;
      }


      .request-top {
        flex-direction:
          column;
      }


      .grid-2 {
        grid-template-columns:
          1fr;
      }


      .modal-actions {
        flex-direction:
          column;
      }


      .left-actions,
      .right-actions {
        width: 100%;
      }


      .left-actions button,
      .right-actions button {
        flex: 1;
      }


      .topbar {
        padding:
          0 18px;
      }


      .container {
        padding:
          28px 15px 50px;
      }

    }

  </style>

</head>


<body>


<header class="topbar">

  <div class="brand">
    Aldovra
  </div>

  <div class="admin-label">
    Admin Dashboard
  </div>

</header>


<main class="container">


  <h1>
    Assessment Requests
  </h1>


  <div class="subtitle">
    Review, approve, conduct and verify Aldovra skill assessments.
  </div>


  <div class="stats">


    <div class="stat-card">

      <div
        class="stat-number"
        id="totalRequests"
      >
        0
      </div>

      <div class="stat-label">
        Total Requests
      </div>

    </div>


    <div class="stat-card">

      <div
        class="stat-number"
        id="pendingRequests"
      >
        0
      </div>

      <div class="stat-label">
        Pending
      </div>

    </div>


    <div class="stat-card">

      <div
        class="stat-number"
        id="completedRequests"
      >
        0
      </div>

      <div class="stat-label">
        Completed
      </div>

    </div>


  </div>


  <div id="requestsContainer">
    Loading requests...
  </div>


</main>


<script>


const SUPABASE_URL =
  "https://lgefwfrjzweayfxahogs.supabase.co";


const SUPABASE_KEY =
  "sb_publishable_f4DHvfDfjqLyugXm6iq6JQ__Q72vK9i";


const {
  createClient
} = supabase;


const db =
  createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


let currentUser = null;


const assessmentNames = {

  1:
    "Python Fundamentals"

};


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


function statusClass(status) {

  if (
    status ===
    "approved"
  )
    return "status-approved";


  if (
    status ===
    "rejected"
  )
    return "status-rejected";


  if (
    status ===
    "completed"
  )
    return "status-completed";


  return "status-pending";

}


async function checkAdmin() {

  const {
    data: {
      user
    },
    error: userError
  } =
    await db.auth.getUser();


  if (
    userError ||
    !user
  ) {

    throw new Error(
      "Please log in to access the admin dashboard."
    );

  }


  const {
    data: admin,
    error: adminError
  } =
    await db
      .from(
        "admin_users"
      )
      .select(
        "user_id"
      )
      .eq(
        "user_id",
        user.id
      )
      .maybeSingle();


  if (
    adminError ||
    !admin
  ) {

    throw new Error(
      "Access denied. You are not an Aldovra admin."
    );

  }


  currentUser =
    user;

}


async function loadRequests() {

  const container =
    document.getElementById(
      "requestsContainer"
    );


  try {

    await checkAdmin();


    const {
      data: requests,
      error
    } =
      await db
        .from(
          "assessment_requests"
        )
        .select(`
          id,
          user_id,
          assessment_id,
          status,
          created_at,
          admin_notes,
          reviewed_at,
          approved_at,
          completed_at,
          email_sent_at
        `)
        .order(
          "created_at",
          {
            ascending:
              false
          }
        );


    if (error)
      throw error;


    document.getElementById(
      "totalRequests"
    ).textContent =
      requests.length;


    document.getElementById(
      "pendingRequests"
    ).textContent =
      requests.filter(
        r =>
          r.status ===
          "pending"
      ).length;


    document.getElementById(
      "completedRequests"
    ).textContent =
      requests.filter(
        r =>
          r.status ===
          "completed"
      ).length;


    if (
      !requests.length
    ) {

      container.innerHTML = `
        <div class="empty">
          No assessment requests yet.
        </div>
      `;

      return;

    }


    container.innerHTML =
      "";


    for (
      const request
      of requests
    ) {


      const {
        data: profile
      } =
        await db
          .from(
            "profiles"
          )
          .select(
            "full_name"
          )
          .eq(
            "id",
            request.user_id
          )
          .maybeSingle();


      const {
        data: details
      } =
        await db
          .from(
            "assessment_request_details"
          )
          .select("*")
          .eq(
            "request_id",
            request.id
          )
          .maybeSingle();


      const studentName =
        profile?.full_name ||
        "Unknown Student";


      const assessmentName =
        assessmentNames[
          request.assessment_id
        ] ||
        `Assessment #${request.assessment_id}`;


      const date =
        new Date(
          request.created_at
        ).toLocaleString();


      const card =
        document.createElement(
          "div"
        );


      card.className =
        "request-card";


      card.innerHTML = `

        <div class="request-top">

          <div>

            <div class="assessment-name">
              ${escapeHtml(
                assessmentName
              )}
            </div>

            <div class="student-info">

              <strong>
                Student:
              </strong>

              ${escapeHtml(
                studentName
              )}

              <br>

              <strong>
                Requested:
              </strong>

              ${escapeHtml(
                date
              )}

              <br>

              <strong>
                Duration:
              </strong>

              ${
                details?.duration_minutes ||
                30
              }
              minutes

              <br>

              <strong>
                Questions:
              </strong>

              ${
                details?.question_count ||
                25
              }

            </div>

          </div>


          <div>

            <span class="
              status
              ${statusClass(
                request.status
              )}
            ">
              ${escapeHtml(
                request.status
              )}
            </span>

          </div>

        </div>


        ${
          request.email_sent_at
          ? `
            <div class="email-sent">
              ✓ Assessment email sent
            </div>
          `
          : ""
        }


        <div class="actions">

          <button
            class="btn btn-primary review-btn"
            type="button"
          >
            Review Request
          </button>

          ${
            request.status ===
            "approved"
            ? `
              <button
                class="btn btn-secondary gmail-btn"
                type="button"
              >
                Open Gmail
              </button>
            `
            : ""
          }

        </div>

      `;


      card
        .querySelector(
          ".review-btn"
        )
        .addEventListener(
          "click",
          () => {

            openReviewModal(
              request,
              studentName,
              assessmentName,
              details
            );

          }
        );


      const gmailButton =
        card.querySelector(
          ".gmail-btn"
        );


      if (gmailButton) {

        gmailButton.addEventListener(
          "click",
          () => {

            openGmailComposer(
              request,
              studentName,
              assessmentName,
              details
            );

          }
        );

      }


      container.appendChild(
        card
      );

    }


  } catch (error) {

    console.error(error);


    container.innerHTML = `

      <div class="empty error">

        ${escapeHtml(
          error.message
        )}

      </div>

    `;

  }

}


function openReviewModal(
  request,
  studentName,
  assessmentName,
  details
) {


  const modal =
    document.createElement(
      "div"
    );


  modal.className =
    "modal-backdrop";


  modal.innerHTML = `

    <div class="modal">


      <div class="modal-header">

        <div>

          <div class="modal-title">
            Review Assessment Request
          </div>

          <div class="student-info">

            ${escapeHtml(
              studentName
            )}

            ·

            ${escapeHtml(
              assessmentName
            )}

          </div>

        </div>


        <button
          class="close-btn"
          id="closeModal"
          type="button"
        >
          ×
        </button>

      </div>


      <div class="info-box">

        <strong>
          Manual Assessment Workflow
        </strong>

        <br>

        Approve the request, prepare the
        assessment details, send them through
        Gmail, conduct the test manually,
        then enter the final score and evidence.

      </div>


      <div class="field">

        <label>
          Request Status
        </label>

        <select id="requestStatus">

          <option
            value="pending"
            ${
              request.status ===
              "pending"
              ? "selected"
              : ""
            }
          >
            Pending
          </option>

          <option
            value="approved"
            ${
              request.status ===
              "approved"
              ? "selected"
              : ""
            }
          >
            Approved
          </option>

          <option
            value="rejected"
            ${
              request.status ===
              "rejected"
              ? "selected"
              : ""
            }
          >
            Rejected
          </option>

          <option
            value="completed"
            ${
              request.status ===
              "completed"
              ? "selected"
              : ""
            }
          >
            Completed
          </option>

        </select>

      </div>


      <div class="grid-2">


        <div class="field">

          <label>
            Duration (minutes)
          </label>

          <input
            id="durationMinutes"
            type="number"
            min="5"
            value="${
              details?.duration_minutes ||
              30
            }"
          >

        </div>


        <div class="field">

          <label>
            Number of Questions
          </label>

          <input
            id="questionCount"
            type="number"
            min="1"
            value="${
              details?.question_count ||
              25
            }"
          >

        </div>


      </div>


      <div class="field">

        <label>
          Question Type
        </label>

        <input
          id="questionType"
          value="${escapeHtml(
            details?.question_type ||
            "MCQ + Scenario Based"
          )}"
        >

      </div>


      <div class="field">

        <label>
          Exam Link
        </label>

        <input
          id="examLink"
          type="url"
          placeholder="https://..."
          value="${escapeHtml(
            details?.exam_link ||
            ""
          )}"
        >

      </div>


      <div class="field">

        <label>
          Scheduled Date & Time
        </label>

        <input
          id="scheduledAt"
          type="datetime-local"
          value="${
            details?.scheduled_at
            ? new Date(
                details.scheduled_at
              )
              .toISOString()
              .slice(
                0,
                16
              )
            : ""
          }"
        >

      </div>


      <div class="field">

        <label>
          Exam Instructions
        </label>

        <textarea
          id="instructions"
        >${escapeHtml(
          details?.instructions ||
          `Complete the assessment independently.

Follow all Aldovra assessment rules.

Do not use unauthorized external assistance.

The assessment must be completed within the scheduled time.

The assessment session may be recorded for verification purposes.`
        )}</textarea>

      </div>


      <div class="field">

        <label>
          Student Email
        </label>

        <input
          id="studentEmail"
          type="email"
          placeholder="student@example.com"
        >

      </div>


      <div class="field">

        <label>
          Score
        </label>

        <input
          id="score"
          type="number"
          min="0"
          max="100"
          value="${
            details?.score ??
            ""
          }"
          placeholder="Enter after assessment"
        >

      </div>


      <div class="field">

        <label>
          Recording / Evidence URL
        </label>

        <input
          id="recordingUrl"
          type="url"
          placeholder="https://..."
          value="${escapeHtml(
            details?.recording_url ||
            ""
          )}"
        >

      </div>


      <div class="field">

        <label>
          Verification Status
        </label>

        <select
          id="verificationStatus"
        >

          <option
            value="not_verified"
            ${
              details?.verification_status ===
              "not_verified"
              ||
              !details
              ? "selected"
              : ""
            }
          >
            Not Verified
          </option>

          <option
            value="verified"
            ${
              details?.verification_status ===
              "verified"
              ? "selected"
              : ""
            }
          >
            Verified
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          Admin Notes
        </label>

        <textarea
          id="adminNotes"
          placeholder="Internal notes..."
        >${escapeHtml(
          details?.admin_notes ||
          request.admin_notes ||
          ""
        )}</textarea>

      </div>


      <div class="modal-actions">


        <div class="left-actions">

          <button
            class="btn btn-secondary"
            id="cancelModal"
            type="button"
          >
            Cancel
          </button>

        </div>


        <div class="right-actions">

          <button
            class="btn btn-success"
            id="saveRequest"
            type="button"
          >
            Save Changes
          </button>

        </div>


      </div>


    </div>

  `;


  document.body.appendChild(
    modal
  );


  function closeModal() {

    modal.remove();

  }


  modal
    .querySelector(
      "#closeModal"
    )
    .addEventListener(
      "click",
      closeModal
    );


  modal
    .querySelector(
      "#cancelModal"
    )
    .addEventListener(
      "click",
      closeModal
    );


  modal
    .querySelector(
      "#saveRequest"
    )
    .addEventListener(
      "click",
      async () => {


        const button =
          modal.querySelector(
            "#saveRequest"
          );


        button.disabled =
          true;


        button.textContent =
          "Saving...";


        try {


          const status =
            modal.querySelector(
              "#requestStatus"
            ).value;


          const durationMinutes =
            Number(
              modal.querySelector(
                "#durationMinutes"
              ).value
            );


          const questionCount =
            Number(
              modal.querySelector(
                "#questionCount"
              ).value
            );


          const scoreInput =
            modal.querySelector(
              "#score"
            ).value;


          const score =
            scoreInput === ""
            ? null
            : Number(
                scoreInput
              );


          const scheduledValue =
            modal.querySelector(
              "#scheduledAt"
            ).value;


          const detailsPayload = {

            request_id:
              request.id,

            duration_minutes:
              durationMinutes ||
              30,

            question_count:
              questionCount ||
              25,

            question_type:
              modal.querySelector(
                "#questionType"
              ).value.trim(),

            instructions:
              modal.querySelector(
                "#instructions"
              ).value.trim(),

            exam_link:
              modal.querySelector(
                "#examLink"
              ).value.trim()
              ||
              null,

            scheduled_at:
              scheduledValue
              ? new Date(
                  scheduledValue
                ).toISOString()
              : null,

            score,

            recording_url:
              modal.querySelector(
                "#recordingUrl"
              ).value.trim()
              ||
              null,

            verification_status:
              modal.querySelector(
                "#verificationStatus"
              ).value,

            admin_notes:
              modal.querySelector(
                "#adminNotes"
              ).value.trim(),

            updated_at:
              new Date()
                .toISOString()

          };


          let detailError;


          if (details) {


            const result =
              await db
                .from(
                  "assessment_request_details"
                )
                .update(
                  detailsPayload
                )
                .eq(
                  "request_id",
                  request.id
                );


            detailError =
              result.error;


          } else {


            const result =
              await db
                .from(
                  "assessment_request_details"
                )
                .insert(
                  detailsPayload
                );


            detailError =
              result.error;

          }


          if (
            detailError
          )
            throw detailError;


          const requestUpdate = {

            status,

            admin_notes:
              modal.querySelector(
                "#adminNotes"
              ).value.trim(),

            reviewed_at:
              new Date()
                .toISOString(),

            reviewed_by:
              currentUser.id

          };


          if (
            status ===
            "approved"
          ) {

            requestUpdate.approved_at =
              new Date()
                .toISOString();

          }


          if (
            status ===
            "completed"
          ) {

            requestUpdate.completed_at =
              new Date()
                .toISOString();

          }


          const {
            error:
              requestUpdateError
          } =
            await db
              .from(
                "assessment_requests"
              )
              .update(
                requestUpdate
              )
              .eq(
                "id",
                request.id
              );


          if (
            requestUpdateError
          )
            throw requestUpdateError;


          closeModal();


          await loadRequests();


          alert(
            "Assessment request updated successfully."
          );


        } catch (
          error
        ) {


          console.error(
            error
          );


          alert(
            "Unable to save changes.\n\n" +
            error.message
          );


          button.disabled =
            false;


          button.textContent =
            "Save Changes";

        }

      }
    );

}


function openGmailComposer(
  request,
  studentName,
  assessmentName,
  details
) {


  const email =
    prompt(
      "Enter student's email address:"
    );


  if (!email)
    return;


  const subject =
    `Aldovra ${assessmentName} — Assessment Details`;


  const scheduledText =
    details?.scheduled_at
    ? new Date(
        details.scheduled_at
      ).toLocaleString()
    : "To be confirmed";


  const body =

`Hi ${studentName},

Your Aldovra skill verification assessment has been approved.

Assessment: ${assessmentName}

Duration: ${
  details?.duration_minutes ||
  30
} minutes

Questions: ${
  details?.question_count ||
  25
}

Question Type:
${
  details?.question_type ||
  "MCQ + Scenario Based"
}

Scheduled Date & Time:
${scheduledText}

Assessment Link:
${
  details?.exam_link ||
  "The assessment link will be shared separately."
}

Assessment Instructions:

${
  details?.instructions ||
  "Complete the assessment independently and follow all Aldovra assessment rules."
}

Please be ready at the scheduled time.

Regards,
Aldovra Team
Skills Verified. Better Hiring.`;


  const gmailUrl =
    "https://mail.google.com/mail/?view=cm" +
    "&fs=1" +
    "&to=" +
    encodeURIComponent(
      email
    ) +
    "&su=" +
    encodeURIComponent(
      subject
    ) +
    "&body=" +
    encodeURIComponent(
      body
    );


  window.open(
    gmailUrl,
    "_blank"
  );


  const shouldMark =
    confirm(
      "Gmail compose opened.\n\nAfter you send the email in Gmail, click OK here to mark it as sent."
    );


  if (
    shouldMark
  ) {

    markEmailSent(
      request.id
    );

  }

}


async function markEmailSent(
  requestId
) {


  const {
    error
  } =
    await db
      .from(
        "assessment_requests"
      )
      .update({
        email_sent_at:
          new Date()
            .toISOString()
      })
      .eq(
        "id",
        requestId
      );


  if (error) {

    console.error(
      error
    );

    alert(
      "Email status could not be updated."
    );

    return;

  }


  await loadRequests();


  alert(
    "Assessment email marked as sent."
  );

}


loadRequests();
