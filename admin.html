<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Aldovra Admin</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #f6f7fb;
      --surface: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --primary: #111827;
      --green: #15803d;
      --green-bg: #dcfce7;
      --yellow: #a16207;
      --yellow-bg: #fef9c3;
      --red: #b91c1c;
      --red-bg: #fee2e2;
      --blue: #1d4ed8;
      --blue-bg: #dbeafe;
      --shadow: 0 10px 30px rgba(0,0,0,0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .topbar {
      height: 70px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 28px;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      font-size: 22px;
      font-weight: 800;
    }

    .admin-label {
      font-size: 13px;
      color: var(--muted);
      margin-left: 8px;
      font-weight: 500;
    }

    .logout-btn {
      border: 1px solid var(--border);
      background: white;
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: 600;
    }

    .container {
      max-width: 1250px;
      margin: 0 auto;
      padding: 30px 22px 60px;
    }

    .page-title {
      margin-bottom: 22px;
    }

    .page-title h1 {
      margin: 0 0 6px;
      font-size: 30px;
    }

    .page-title p {
      margin: 0;
      color: var(--muted);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 25px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 20px;
      box-shadow: var(--shadow);
    }

    .stat-label {
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 8px;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 800;
    }

    .requests {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .request-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .request-top {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: flex-start;
    }

    .assessment-name {
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 7px;
    }

    .student-name {
      color: var(--muted);
      font-size: 14px;
    }

    .status {
      display: inline-flex;
      align-items: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
    }

    .status.pending {
      color: var(--yellow);
      background: var(--yellow-bg);
    }

    .status.approved {
      color: var(--blue);
      background: var(--blue-bg);
    }

    .status.completed {
      color: var(--green);
      background: var(--green-bg);
    }

    .status.rejected {
      color: var(--red);
      background: var(--red-bg);
    }

    .request-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      margin: 20px 0;
    }

    .info-box {
      background: var(--bg);
      border-radius: 10px;
      padding: 12px;
    }

    .info-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 14px;
      font-weight: 700;
    }

    .email-sent {
      margin: 12px 0;
      padding: 10px 13px;
      background: var(--green-bg);
      color: var(--green);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .email-not-sent {
      margin: 12px 0;
      padding: 10px 13px;
      background: var(--yellow-bg);
      color: var(--yellow);
      border-radius: 9px;
      font-size: 13px;
      font-weight: 700;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .btn {
      border: 0;
      border-radius: 9px;
      padding: 10px 15px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: white;
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-green {
      background: #15803d;
      color: white;
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .empty {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 45px;
      text-align: center;
      color: var(--muted);
    }

    /* MODAL */

    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-overlay.show {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal {
      width: min(850px, 100%);
      background: white;
      border-radius: 18px;
      box-shadow: 0 25px 70px rgba(0,0,0,0.2);
      overflow: hidden;
    }

    .modal-header {
      padding: 22px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      gap: 20px;
    }

    .modal-header h2 {
      margin: 0 0 5px;
      font-size: 22px;
    }

    .modal-header p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .close-btn {
      border: 0;
      background: transparent;
      font-size: 26px;
      cursor: pointer;
      color: var(--muted);
    }

    .modal-body {
      padding: 24px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field label {
      font-size: 13px;
      font-weight: 700;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 11px 12px;
      outline: none;
      background: white;
    }

    .field textarea {
      min-height: 100px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #9ca3af;
    }

    .modal-footer {
      padding: 18px 24px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--muted);
    }

    @media (max-width: 750px) {
      .topbar {
        padding: 0 16px;
      }

      .container {
        padding: 22px 14px 50px;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .request-info {
        grid-template-columns: 1fr;
      }

      .request-top {
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }

      .modal-overlay {
        padding: 10px;
      }

      .modal-body {
        padding: 18px;
      }

      .modal-header {
        padding: 18px;
      }

      .modal-footer {
        padding: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="topbar">
    <div>
      <span class="brand">Aldovra</span>
      <span class="admin-label">Admin</span>
    </div>

    <button class="logout-btn" id="logoutBtn">
      Logout
    </button>
  </header>

  <main class="container">

    <div class="page-title">
      <h1>Assessment Requests</h1>
      <p>Review and manage student skill verification assessments.</p>
    </div>

    <section class="stats">
      <div class="stat-card">
        <div class="stat-label">Total Requests</div>
        <div class="stat-value" id="totalRequests">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value" id="pendingRequests">0</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value" id="completedRequests">0</div>
      </div>
    </section>

    <section id="requestsContainer" class="requests">
      <div class="loading">
        Loading assessment requests...
      </div>
    </section>

  </main>


  <!-- REVIEW MODAL -->

  <div class="modal-overlay" id="reviewModal">

    <div class="modal">

      <div class="modal-header">

        <div>
          <h2>Review Assessment Request</h2>
          <p id="modalStudentInfo">
            Student · Assessment
          </p>
        </div>

        <button
          class="close-btn"
          id="closeModalBtn"
          type="button"
        >
          ×
        </button>

      </div>


      <div class="modal-body">

        <div class="form-grid">

          <div class="field">
            <label>Request Status</label>

            <select id="statusInput">
              <option value="pending">Pending</option>
              <option value="approved">Approved</option>
              <option value="completed">Completed</option>
              <option value="rejected">Rejected</option>
            </select>
          </div>


          <div class="field">
            <label>Student Email</label>

            <input
              type="email"
              id="studentEmailInput"
              placeholder="student@example.com"
            />
          </div>


          <div class="field">
            <label>Duration (minutes)</label>

            <input
              type="number"
              id="durationInput"
              value="30"
              min="1"
            />
          </div>


          <div class="field">
            <label>Question Count</label>

            <input
              type="number"
              id="questionCountInput"
              value="25"
              min="1"
            />
          </div>


          <div class="field">
            <label>Question Type</label>

            <select id="questionTypeInput">

              <option>
                MCQ + Scenario Based
              </option>

              <option>
                MCQ
              </option>

              <option>
                Scenario Based
              </option>

              <option>
                Technical + Scenario
              </option>

            </select>
          </div>


          <div class="field">
            <label>Exam Link</label>

            <input
              type="url"
              id="examLinkInput"
              placeholder="https://..."
            />
          </div>


          <div class="field">
            <label>Scheduled Date & Time</label>

            <input
              type="datetime-local"
              id="scheduledAtInput"
            />
          </div>


          <div class="field">
            <label>Score (%)</label>

            <input
              type="number"
              id="scoreInput"
              placeholder="0"
              min="0"
              max="100"
            />
          </div>


          <div class="field full">
            <label>Assessment Instructions</label>

            <textarea
              id="instructionsInput"
              placeholder="Enter assessment instructions..."
            ></textarea>
          </div>


          <div class="field full">
            <label>Recording / Evidence URL</label>

            <input
              type="url"
              id="recordingUrlInput"
              placeholder="https://..."
            />
          </div>


          <div class="field">
            <label>Verification Status</label>

            <select id="verificationStatusInput">

              <option value="not_verified">
                Not Verified
              </option>

              <option value="verified">
                Verified
              </option>

              <option value="rejected">
                Rejected
              </option>

            </select>
          </div>


          <div class="field full">
            <label>Admin Notes</label>

            <textarea
              id="adminNotesInput"
              placeholder="Internal admin notes..."
            ></textarea>
          </div>

        </div>

      </div>


      <div class="modal-footer">

        <button
          class="btn btn-secondary"
          id="cancelModalBtn"
          type="button"
        >
          Cancel
        </button>

        <button
          class="btn btn-primary"
          id="saveChangesBtn"
          type="button"
        >
          Save Changes
        </button>

      </div>

    </div>

  </div>


<script>

  /* ================================
     SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://lgefwfrjzweayfxahogs.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_f4DHvfDfjqLyugXm6iq6JQ__Q72vK9i";

  const {
    createClient
  } = supabase;

  const db =
    createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* ================================
     ASSESSMENT NAMES
  ================================= */

  const assessmentNames = {
    1: "Python Fundamentals"
  };


  let currentRequest = null;
  let currentDetails = null;


  /* ================================
     AUTH + ADMIN CHECK
  ================================= */

  async function checkAdmin() {

    const {
      data: {
        user
      }
    } = await db.auth.getUser();

    if (!user) {

      window.location.href = "login.html";

      return null;
    }


    const {
      data: adminUser,
      error
    } = await db
      .from("admin_users")
      .select("user_id")
      .eq("user_id", user.id)
      .maybeSingle();


    if (error) {

      console.error(error);

      document.body.innerHTML = `
        <div style="
          padding:50px;
          text-align:center;
          font-family:Arial;
        ">
          <h2>Admin verification failed</h2>
          <p>${error.message}</p>
        </div>
      `;

      return null;
    }


    if (!adminUser) {

      document.body.innerHTML = `
        <div style="
          padding:50px;
          text-align:center;
          font-family:Arial;
        ">
          <h2>Access denied</h2>
          <p>You are not an Aldovra admin.</p>
        </div>
      `;

      return null;
    }


    return user;
  }


  /* ================================
     LOAD REQUESTS
  ================================= */

  async function loadRequests() {

    const container =
      document.getElementById(
        "requestsContainer"
      );

    container.innerHTML = `
      <div class="loading">
        Loading assessment requests...
      </div>
    `;


    const {
      data: requests,
      error
    } = await db
      .from("assessment_requests")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


    if (error) {

      console.error(error);

      container.innerHTML = `
        <div class="empty">
          <h3>Could not load requests</h3>
          <p>${error.message}</p>
        </div>
      `;

      return;
    }


    if (!requests || requests.length === 0) {

      updateStats([]);

      container.innerHTML = `
        <div class="empty">
          <h3>No assessment requests yet</h3>
          <p>Student assessment requests will appear here.</p>
        </div>
      `;

      return;
    }


    updateStats(requests);


    const userIds =
      [
        ...new Set(
          requests.map(
            r => r.user_id
          )
        )
      ];


    let profiles = [];


    if (userIds.length) {

      const {
        data
      } = await db
        .from("profiles")
        .select(
          "id, full_name"
        )
        .in(
          "id",
          userIds
        );

      profiles = data || [];
    }


    const profileMap = {};

    profiles.forEach(
      profile => {

        profileMap[
          profile.id
        ] = profile;

      }
    );


    const requestIds =
      requests.map(
        r => r.id
      );


    let details = [];


    if (requestIds.length) {

      const {
        data
      } = await db
        .from(
          "assessment_request_details"
        )
        .select("*")
        .in(
          "request_id",
          requestIds
        );

      details = data || [];
    }


    const detailsMap = {};

    details.forEach(
      detail => {

        detailsMap[
          detail.request_id
        ] = detail;

      }
    );


    container.innerHTML =
      requests.map(
        request => {

          const profile =
            profileMap[
              request.user_id
            ];

          const detail =
            detailsMap[
              request.id
            ] || {};


          const studentName =
            profile?.full_name ||
            "Unknown Student";


          const assessmentName =
            assessmentNames[
              request.assessment_id
            ] ||
            `Assessment #${request.assessment_id}`;


          const status =
            request.status ||
            "pending";


          const createdDate =
            request.created_at
              ? new Date(
                  request.created_at
                ).toLocaleString()
              : "—";


          const emailSent =
            request.email_sent_at;


          return `

            <article
              class="request-card"
            >

              <div class="request-top">

                <div>

                  <div class="assessment-name">
                    ${escapeHtml(
                      assessmentName
                    )}
                  </div>

                  <div class="student-name">
                    Student:
                    ${escapeHtml(
                      studentName
                    )}
                  </div>

                </div>


                <span
                  class="status ${status}"
                >
                  ${escapeHtml(status)}
                </span>

              </div>


              <div class="request-info">

                <div class="info-box">

                  <div class="info-label">
                    Requested
                  </div>

                  <div class="info-value">
                    ${createdDate}
                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Duration
                  </div>

                  <div class="info-value">
                    ${detail.duration_minutes || 30}
                    minutes
                  </div>

                </div>


                <div class="info-box">

                  <div class="info-label">
                    Questions
                  </div>

                  <div class="info-value">
                    ${detail.question_count || 25}
                  </div>

                </div>

              </div>


              ${
                emailSent

                ? `

                  <div class="email-sent">
                    ✓ Assessment email sent
                    ${
                      new Date(
                        emailSent
                      ).toLocaleString()
                    }
                  </div>

                `

                : status === "approved"

                ? `

                  <div class="email-not-sent">
                    ⚠ Assessment email not sent yet
                  </div>

                `

                : ""

              }


              <div class="actions">

                <button
                  class="btn btn-primary"
                  onclick="openReview(${request.id})"
                >
                  Review Request
                </button>


                ${
                  status === "approved"

                  ? `

                    <button
                      class="btn btn-secondary"
                      onclick="openGmail(${request.id})"
                    >
                      Open Gmail
                    </button>

                    ${
                      emailSent

                      ? `

                        <button
                          class="btn btn-green"
                          disabled
                        >
                          Email Sent ✓
                        </button>

                      `

                      : `

                        <button
                          class="btn btn-green"
                          onclick="markEmailSent(${request.id})"
                        >
                          Mark Email Sent
                        </button>

                      `
                    }

                  `

                  : ""

                }

              </div>

            </article>

          `;

        }
      ).join("");

  }


  /* ================================
     STATS
  ================================= */

  function updateStats(requests) {

    const total =
      requests.length;


    const pending =
      requests.filter(
        r => r.status === "pending"
      ).length;


    const completed =
      requests.filter(
        r => r.status === "completed"
      ).length;


    document.getElementById(
      "totalRequests"
    ).textContent = total;


    document.getElementById(
      "pendingRequests"
    ).textContent = pending;


    document.getElementById(
      "completedRequests"
    ).textContent = completed;

  }


  /* ================================
     OPEN REVIEW
  ================================= */

  async function openReview(
    requestId
  ) {

    const {
      data: request,
      error
    } = await db
      .from("assessment_requests")
      .select("*")
      .eq(
        "id",
        requestId
      )
      .single();


    if (error) {

      alert(
        "Could not load request."
      );

      console.error(error);

      return;
    }


    const {
      data: details
    } = await db
      .from(
        "assessment_request_details"
      )
      .select("*")
      .eq(
        "request_id",
        requestId
      )
      .maybeSingle();


    const {
      data: profile
    } = await db
      .from("profiles")
      .select(
        "full_name"
      )
      .eq(
        "id",
        request.user_id
      )
      .maybeSingle();


    currentRequest =
      request;

    currentDetails =
      details || {};


    const studentName =
      profile?.full_name ||
      "Unknown Student";


    const assessmentName =
      assessmentNames[
        request.assessment_id
      ] ||
      `Assessment #${request.assessment_id}`;


    document.getElementById(
      "modalStudentInfo"
    ).textContent =
      `${studentName} · ${assessmentName}`;


    document.getElementById(
      "statusInput"
    ).value =
      request.status ||
      "pending";


    document.getElementById(
      "studentEmailInput"
    ).value =
      details?.student_email ||
      "";


    document.getElementById(
      "durationInput"
    ).value =
      details?.duration_minutes ||
      30;


    document.getElementById(
      "questionCountInput"
    ).value =
      details?.question_count ||
      25;


    document.getElementById(
      "questionTypeInput"
    ).value =
      details?.question_type ||
      "MCQ + Scenario Based";


    document.getElementById(
      "examLinkInput"
    ).value =
      details?.exam_link ||
      "";


    document.getElementById(
      "instructionsInput"
    ).value =
      details?.instructions ||
      "";


    document.getElementById(
      "scoreInput"
    ).value =
      details?.score ??
      "";


    document.getElementById(
      "recordingUrlInput"
    ).value =
      details?.recording_url ||
      "";


    document.getElementById(
      "verificationStatusInput"
    ).value =
      details?.verification_status ||
      "not_verified";


    document.getElementById(
      "adminNotesInput"
    ).value =
      details?.admin_notes ||
      request.admin_notes ||
      "";


    if (
      details?.scheduled_at
    ) {

      const date =
        new Date(
          details.scheduled_at
        );


      const local =
        new Date(
          date.getTime()
          -
          date.getTimezoneOffset()
          * 60000
        )
        .toISOString()
        .slice(
          0,
          16
        );


      document.getElementById(
        "scheduledAtInput"
      ).value =
        local;

    } else {

      document.getElementById(
        "scheduledAtInput"
      ).value =
        "";

    }


    document.getElementById(
      "reviewModal"
    ).classList.add(
      "show"
    );

  }


  /* ================================
     CLOSE MODAL
  ================================= */

  function closeModal() {

    document.getElementById(
      "reviewModal"
    ).classList.remove(
      "show"
    );

    currentRequest =
      null;

    currentDetails =
      null;

  }


  /* ================================
     SAVE CHANGES
  ================================= */

  async function saveChanges() {

    if (!currentRequest) {
      return;
    }


    const saveButton =
      document.getElementById(
        "saveChangesBtn"
      );


    saveButton.disabled =
      true;

    saveButton.textContent =
      "Saving...";


    try {

      const {
        data: {
          user
        }
      } = await db.auth.getUser();


      const status =
        document.getElementById(
          "statusInput"
        ).value;


      const studentEmail =
        document.getElementById(
          "studentEmailInput"
        ).value.trim();


      const duration =
        Number(
          document.getElementById(
            "durationInput"
          ).value
        ) || 30;


      const questionCount =
        Number(
          document.getElementById(
            "questionCountInput"
          ).value
        ) || 25;


      const questionType =
        document.getElementById(
          "questionTypeInput"
        ).value;


      const examLink =
        document.getElementById(
          "examLinkInput"
        ).value.trim();


      const instructions =
        document.getElementById(
          "instructionsInput"
        ).value.trim();


      const scoreValue =
        document.getElementById(
          "scoreInput"
        ).value;


      const score =
        scoreValue === ""
          ? null
          : Number(
              scoreValue
            );


      const recordingUrl =
        document.getElementById(
          "recordingUrlInput"
        ).value.trim();


      const verificationStatus =
        document.getElementById(
          "verificationStatusInput"
        ).value;


      const adminNotes =
        document.getElementById(
          "adminNotesInput"
        ).value.trim();


      const scheduledInput =
        document.getElementById(
          "scheduledAtInput"
        ).value;


      const scheduledAt =
        scheduledInput
          ? new Date(
              scheduledInput
            ).toISOString()
          : null;


      const detailsPayload = {

        request_id:
          currentRequest.id,

        student_email:
          studentEmail,

        duration_minutes:
          duration,

        question_count:
          questionCount,

        question_type:
          questionType,

        instructions:
          instructions,

        exam_link:
          examLink,

        scheduled_at:
          scheduledAt,

        score:
          score,

        recording_url:
          recordingUrl,

        verification_status:
          verificationStatus,

        admin_notes:
          adminNotes

      };


      let detailsError;


      if (currentDetails?.id) {

        const {
          error
        } = await db
          .from(
            "assessment_request_details"
          )
          .update(
            detailsPayload
          )
          .eq(
            "id",
            currentDetails.id
          );


        detailsError =
          error;

      } else {

        const {
          error
        } = await db
          .from(
            "assessment_request_details"
          )
          .insert(
            detailsPayload
          );


        detailsError =
          error;

      }


      if (detailsError) {
        throw detailsError;
      }


      const requestUpdate = {

        status:
          status,

        admin_notes:
          adminNotes,

        reviewed_at:
          new Date().toISOString(),

        reviewed_by:
          user.id

      };


      if (
        status === "approved"
        &&
        !currentRequest.approved_at
      ) {

        requestUpdate.approved_at =
          new Date().toISOString();

      }


      if (
        status === "completed"
      ) {

        requestUpdate.completed_at =
          currentRequest.completed_at ||
          new Date().toISOString();

      }


      const {
        error: requestError
      } = await db
        .from(
          "assessment_requests"
        )
        .update(
          requestUpdate
        )
        .eq(
          "id",
          currentRequest.id
        );


      if (requestError) {
        throw requestError;
      }


      alert(
        "Assessment request updated successfully."
      );


      closeModal();

      await loadRequests();

    }

    catch (error) {

      console.error(error);

      alert(
        "Could not save changes.\n\n" +
        error.message
      );

    }

    finally {

      saveButton.disabled =
        false;

      saveButton.textContent =
        "Save Changes";

    }

  }


  /* ================================
     OPEN GMAIL
  ================================= */

  async function openGmail(
    requestId
  ) {

    const {
      data: request,
      error
    } = await db
      .from(
        "assessment_requests"
      )
      .select("*")
      .eq(
        "id",
        requestId
      )
      .single();


    if (error) {

      alert(
        "Could not load assessment request."
      );

      return;
    }


    const {
      data: details
    } = await db
      .from(
        "assessment_request_details"
      )
      .select("*")
      .eq(
        "request_id",
        requestId
      )
      .maybeSingle();


    if (
      !details?.student_email
    ) {

      alert(
        "Student email is missing.\n\n" +
        "Open Review Request, enter the student email, and click Save Changes."
      );

      return;
    }


    const {
      data: profile
    } = await db
      .from("profiles")
      .select(
        "full_name"
      )
      .eq(
        "id",
        request.user_id
      )
      .maybeSingle();


    const studentName =
      profile?.full_name ||
      "Student";


    const assessmentName =
      assessmentNames[
        request.assessment_id
      ] ||
      `Assessment #${request.assessment_id}`;


    const scheduledText =
      details.scheduled_at

      ? new Date(
          details.scheduled_at
        ).toLocaleString()

      : "To be confirmed";


    const examLink =
      details.exam_link ||
      "Link will be shared separately";


    const instructions =
      details.instructions ||
      "Please be ready at the scheduled time.";


    const subject =
      `Aldovra ${assessmentName} — Assessment Details`;


    const body =

`Hi ${studentName},

Your Aldovra skill verification assessment has been approved.

Assessment: ${assessmentName}
Duration: ${details.duration_minutes || 30} minutes
Questions: ${details.question_count || 25}
Question Type: ${details.question_type || "MCQ + Scenario Based"}

Scheduled Date & Time: ${scheduledText}

Assessment Link:
${examLink}

Assessment Instructions:
${instructions}

Please be ready at the scheduled time.

Best regards,
Aldovra Team
Skills Verified. Better Hiring.`;


    const gmailUrl =
      "https://mail.google.com/mail/?view=cm" +
      "&fs=1" +
      "&to=" +
      encodeURIComponent(
        details.student_email
      ) +
      "&su=" +
      encodeURIComponent(
        subject
      ) +
      "&body=" +
      encodeURIComponent(
        body
      );


    window.open(
      gmailUrl,
      "_blank"
    );

  }


  /* ================================
     MARK EMAIL SENT
  ================================= */

  async function markEmailSent(
    requestId
  ) {

    const confirmed =
      confirm(
        "Have you sent the assessment email from Gmail?"
      );


    if (!confirmed) {
      return;
    }


    const {
      error
    } = await db
      .from(
        "assessment_requests"
      )
      .update({

        email_sent_at:
          new Date().toISOString()

      })
      .eq(
        "id",
        requestId
      );


    if (error) {

      console.error(error);

      alert(
        "Could not mark email as sent.\n\n" +
        error.message
      );

      return;
    }


    await loadRequests();

  }


  /* ================================
     ESCAPE HTML
  ================================= */

  function escapeHtml(
    value
  ) {

    return String(
      value ?? ""
    )
      .replace(
        /&/g,
        "&amp;"
      )
      .replace(
        /</g,
        "&lt;"
      )
      .replace(
        />/g,
        "&gt;"
      )
      .replace(
        /"/g,
        "&quot;"
      )
      .replace(
        /'/g,
        "&#039;"
      );

  }


  /* ================================
     EVENTS
  ================================= */

  document
    .getElementById(
      "closeModalBtn"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "cancelModalBtn"
    )
    .addEventListener(
      "click",
      closeModal
    );


  document
    .getElementById(
      "saveChangesBtn"
    )
    .addEventListener(
      "click",
      saveChanges
    );


  document
    .getElementById(
      "reviewModal"
    )
    .addEventListener(
      "click",
      function(e) {

        if (
          e.target ===
          this
        ) {

          closeModal();

        }

      }
    );


  document
    .getElementById(
      "logoutBtn"
    )
    .addEventListener(
      "click",
      async function() {

        await db.auth.signOut();

        window.location.href =
          "login.html";

      }
    );


  /* ================================
     START
  ================================= */

  (async function() {

    const user =
      await checkAdmin();


    if (!user) {
      return;
    }


    await loadRequests();

  })();

</script>
