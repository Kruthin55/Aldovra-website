<body class="ald-auth" data-auth="reset">

    <header class="topbar">

        <a href="/" class="logo">
            <img src="/assets/aldovra-logo-128.webp" alt="Aldovra">
            <span>Aldovra</span>
        </a>

        <a href="/login.html" class="back-link">
            ← Back to Login
        </a>

    </header>

    <main class="page">

        <section class="card">

            <div class="heading">
                <h1>Create a new password</h1>

                <p>
                    Choose a strong password to secure your
                    Aldovra account.
                </p>
            </div>

            <form id="resetForm">

                <div class="form-group">

                    <label for="password">
                        New password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm new password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="resetBtn"
                >
                    Update Password
                </button>

                <div id="message" class="message"></div>

            </form>

            <div class="login-text">
                Remember your password?
                <a href="/login.html">Log in</a>
            </div>

            <div class="footer-note">
                Aldovra · Skills Verified. Better Hiring.
            </div>

        </section>

    </main>

    <script>
const SUPABASE_URL = "https://lgefwfrjzweayfxahogs.supabase.co";

const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_f4DHvfDfjqLyugXm6iq6JQ__Q72vK9i";

const { createClient } = window.supabase;

const supabaseClient = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const form = document.getElementById("resetForm");

const resetBtn = document.getElementById("resetBtn");

const message = document.getElementById("message");

function showMessage(text, type) {
  message.textContent = text;
  message.className = "message " + type;
}

(function showLinkError() {
  let p;
  try { p = new URLSearchParams((location.hash || "").replace(/^#/, "") || location.search.replace(/^\?/, "")); } catch (e) { return; }
  if (!p.get("error_code") && !p.get("error")) return;
  showMessage("This reset link was already used or has expired. Go back to login, tap \u201cForgot password?\u201d and we\u2019ll send a fresh one.", "error");
  history.replaceState(null, "", location.pathname);
})();

form.addEventListener("submit", async function (event) {
  event.preventDefault();
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;
  message.className = "message";
  message.textContent = "";
  if (password.length < 6) {
    showMessage("Password must contain at least 6 characters.", "error");
    return;
  }
  if (password !== confirmPassword) {
    showMessage("Passwords do not match. Please check again.", "error");
    return;
  }
  resetBtn.disabled = true;
  resetBtn.textContent = "Updating...";
  try {
    const { error } = await supabaseClient.auth.updateUser({
      password: password,
    });
    if (error) {
      throw error;
    }
    showMessage("Password updated successfully! Redirecting to login...", "success");
    form.reset();
    setTimeout(function () {
      window.location.href = "/login.html";
    }, 1500);
  } catch (error) {
    console.error(error);
    showMessage(error.message || "Unable to update password. Please try again.", "error");
  } finally {
    resetBtn.disabled = false;
    resetBtn.textContent = "Update Password";
  }
});
</script>

<script src="/assets/aldovra-auth.js"></script>
</body>
