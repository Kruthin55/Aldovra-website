<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password — Aldovra</title>

    <meta name="description"
          content="Create a new password for your Aldovra account.">

    <link rel="icon" type="image/png" href="/aldovra-logo.png">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Inter, Arial, sans-serif;
            min-height: 100vh;
            background:
                radial-gradient(circle at 15% 20%, rgba(124,58,237,.14), transparent 32%),
                radial-gradient(circle at 85% 80%, rgba(99,102,241,.10), transparent 30%),
                #f8f7fc;
            color: #17121f;
            display: flex;
            flex-direction: column;
        }

        .topbar {
            width: 100%;
            padding: 22px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: #17121f;
            font-size: 22px;
            font-weight: 800;
        }

        .logo img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 10px;
        }

        .back-link {
            text-decoration: none;
            color: #62556f;
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover {
            color: #6d28d9;
        }

        .page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px 60px;
        }

        .card {
            width: 100%;
            max-width: 470px;
            background: rgba(255,255,255,.94);
            border: 1px solid #e8e0f2;
            border-radius: 24px;
            padding: 42px;
            box-shadow: 0 24px 70px rgba(71,45,105,.10);
        }

        .heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .heading h1 {
            font-size: 31px;
            line-height: 1.2;
            margin-bottom: 10px;
            letter-spacing: -.8px;
        }

        .heading p {
            color: #766a82;
            font-size: 15px;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            color: #403448;
        }

        input {
            width: 100%;
            height: 50px;
            border: 1px solid #ddd4e8;
            border-radius: 12px;
            padding: 0 15px;
            background: #fff;
            color: #21182b;
            font-size: 15px;
            outline: none;
            transition: .2s ease;
        }

        input:focus {
            border-color: #8b5cf6;
            box-shadow: 0 0 0 4px rgba(139,92,246,.10);
        }

        .submit-btn {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            margin-top: 8px;
            background: linear-gradient(135deg, #7c3aed, #6d28d9);
            color: white;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(109,40,217,.22);
            transition: .2s ease;
        }

        .submit-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 13px 30px rgba(109,40,217,.28);
        }

        .submit-btn:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 14px 15px;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
        }

        .message.success {
            display: block;
            background: #ecfdf5;
            border: 1px solid #bbf7d0;
            color: #166534;
        }

        .message.error {
            display: block;
            background: #fef2f2;
            border: 1px solid #fecaca;
            color: #991b1b;
        }

        .login-text {
            text-align: center;
            margin-top: 24px;
            font-size: 14px;
            color: #766a82;
        }

        .login-text a {
            color: #6d28d9;
            text-decoration: none;
            font-weight: 800;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: #968ba0;
        }

        @media (max-width: 600px) {

            .topbar {
                padding: 18px 20px;
            }

            .logo {
                font-size: 19px;
            }

            .logo img {
                width: 36px;
                height: 36px;
            }

            .page {
                padding: 15px 16px 40px;
                align-items: flex-start;
            }

            .card {
                margin-top: 15px;
                padding: 28px 20px;
                border-radius: 20px;
            }

            .heading h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <header class="topbar">

        <a href="/" class="logo">
            <img src="/aldovra-logo.png" alt="Aldovra">
            <span>Aldovra</span>
        </a>

        <a href="/login.html" class="back-link">
            ← Back to Login
        </a>

    </header>

    <main class="page">

        <section class="card">

            <div class="heading">
                <h1>Create a new password</h1>

                <p>
                    Choose a strong password to secure your
                    Aldovra account.
                </p>
            </div>

            <form id="resetForm">

                <div class="form-group">

                    <label for="password">
                        New password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm new password
                    </label>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Re-enter your new password"
                        autocomplete="new-password"
                        minlength="6"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="submit-btn"
                    id="resetBtn"
                >
                    Update Password
                </button>

                <div id="message" class="message"></div>

            </form>

            <div class="login-text">
                Remember your password?
                <a href="/login.html">Log in</a>
            </div>

            <div class="footer-note">
                Aldovra · Skills Verified. Better Hiring.
            </div>

        </section>

    </main>

    <script>

        const SUPABASE_URL =
            "https://lgefwfrjzweayfxahogs.supabase.co";

        const SUPABASE_PUBLISHABLE_KEY =
            "sb_publishable_f4DHvfDfjqLyugXm6iq6JQ__Q72vK9i";

        const { createClient } = window.supabase;

        const supabaseClient = createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        const form =
            document.getElementById("resetForm");

        const resetBtn =
            document.getElementById("resetBtn");

        const message =
            document.getElementById("message");

        function showMessage(text, type) {

            message.textContent = text;

            message.className =
                "message " + type;
        }

        form.addEventListener("submit", async function(event) {

            event.preventDefault();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            message.className = "message";
            message.textContent = "";

            if (password.length < 6) {

                showMessage(
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }

            if (password !== confirmPassword) {

                showMessage(
                    "Passwords do not match. Please check again.",
                    "error"
                );

                return;
            }

            resetBtn.disabled = true;
            resetBtn.textContent = "Updating...";

            try {

                const { error } =
                    await supabaseClient.auth.updateUser({
                        password: password
                    });

                if (error) {
                    throw error;
                }

                showMessage(
                    "Password updated successfully! Redirecting to login...",
                    "success"
                );

                form.reset();

                setTimeout(function() {

                    window.location.href =
                        "/login.html";

                }, 1500);

            } catch (error) {

                console.error(error);

                showMessage(
                    error.message ||
                    "Unable to update password. Please try again.",
                    "error"
                );

            } finally {

                resetBtn.disabled = false;
                resetBtn.textContent = "Update Password";

            }

        });

    </script>

</body>
</html>
