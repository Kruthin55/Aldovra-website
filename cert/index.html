<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Verify certificate | Aldovra</title>
<meta name="description" content="Check an Aldovra verified-skill certificate by its credential ID.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Aldovra">
<meta property="og:title" content="Aldovra verified skill certificate">
<meta property="og:description" content="Skill proven in a proctored assessment and reviewed by Aldovra. Check it with the credential ID.">
<meta property="og:image" content="https://aldovra.com/og-card.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://aldovra.com/og-card.png">
<meta name="theme-color" content="#0d0d12">
<link rel="icon" type="image/png" href="/aldovra-logo.png">
<link rel="preconnect" href="https://lgefwfrjzweayfxahogs.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/aldovra-credential.css">
</head>
<body>
<header class="cr-top">
  <div class="wrap">
    <a class="cr-brand" href="/"><img src="/aldovra-logo.png" alt="">Aldovra</a>
    <span class="cr-top-tag">Credential verification</span>
    <a class="cr-cta" href="/signup.html">Get verified free →</a>
  </div>
</header>

<main id="app" class="wrap">
  <div class="ct-page" aria-busy="true">
    <div class="skel" style="height:70px;border-radius:18px;margin-bottom:24px"></div>
    <div class="skel" style="aspect-ratio:1123/794;border-radius:8px"></div>
  </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/vendor/aldovra-qr.js"></script>
<script src="/assets/aldovra-credential.js"></script>
<script>
(function () {
  var C = window.AldCred, esc = C.esc, I = C.ICON, app = document.getElementById("app");
  var code = C.queryKey(["c", "code", "id"]).toUpperCase();

  function notFound(title, text) {
    C.setMeta("Certificate not found | Aldovra");
    app.innerHTML =
      '<section class="state"><div><div class="kicker">Credential check</div>' +
      "<h1>" + title + "</h1><p>" + text + "</p>" +
      '<form id="lookup" style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">' +
      '<input id="lookupCode" placeholder="ALD-XXXX-XXXX" autocomplete="off" spellcheck="false" ' +
      'style="height:44px;padding:0 16px;border-radius:999px;border:1px solid var(--line);font:500 15px var(--mono);letter-spacing:.06em;text-transform:uppercase;min-width:220px">' +
      '<button class="btn dark" type="submit">Check credential</button></form></div></section>';
    document.getElementById("lookup").addEventListener("submit", function (e) {
      e.preventDefault();
      var v = document.getElementById("lookupCode").value.trim().toUpperCase();
      if (v) location.href = "/cert/?" + encodeURIComponent(v);
    });
  }

  function seal(text) {
    return '<svg class="txt" viewBox="0 0 168 168" aria-hidden="true"><defs><path id="sealPath" d="M84,84 m-66,0 a66,66 0 1,1 132,0 a66,66 0 1,1 -132,0"/></defs>' +
      '<text fill="#fff" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" ><textPath href="#sealPath" textLength="408" lengthAdjust="spacing">' + text + "</textPath></text></svg>";
  }

  function render(c) {
    var url = C.certUrl(c.code);
    var issued = C.fmtDate(c.issued_at);
    var hasScore = c.score != null;
    var valid = !!c.valid;
    C.setMeta(c.holder + " — " + c.skill + " verified | Aldovra",
      c.holder + " verified " + c.skill + " on Aldovra" + (hasScore ? " with " + C.score(c.score) : "") + ". Credential " + c.code + ".");

    var status = valid
      ? '<div class="ct-status ok reveal"><span class="ic">' + I.check + "</span><div><strong>Valid credential</strong>" +
        "<span>Issued by Aldovra to " + esc(c.holder) + " on " + esc(issued) + ".</span></div></div>"
      : '<div class="ct-status bad reveal"><span class="ic">' + I.x + "</span><div><strong>This certificate was revoked</strong>" +
        "<span>It is no longer valid" + (c.revoked_at ? " (since " + esc(C.fmtDate(c.revoked_at)) + ")" : "") + ".</span></div></div>";

    var cert =
      '<div class="cert-fit"><div class="cert' + (valid ? "" : " revoked") + '" id="certEl">' +
        '<div class="grid"></div><div class="glow"></div>' +
        '<div class="in">' +
          '<div class="hd"><div class="lg"><img src="/aldovra-logo.png" alt="">Aldovra</div>' +
          '<div class="no">Credential ID<br><b style="color:#0d0d12;letter-spacing:.06em">' + esc(c.code) + "</b></div></div>" +
          '<div class="ttl">Certificate of skill verification</div>' +
          '<div class="lead">This certifies that</div>' +
          '<div class="who">' + esc(c.holder) + "</div>" +
          '<div class="rule"></div>' +
          '<div class="what">has proven their skill in</div>' +
          '<div class="skill">' + esc(c.skill) + "</div>" +
          '<div class="what" style="margin-top:14px">in a proctored Aldovra assessment' +
            (hasScore ? ", scoring <b>" + esc(C.score(c.score)) + "</b>" : "") +
            ", with the exam environment reviewed by the Aldovra team.</div>" +
          '<div class="ft">' +
            '<div class="sig"><div class="line"></div><b>Aldovra Verification Team</b><span>Issued ' + esc(issued) + "</span></div>" +
            '<div class="qrbox"><span>Scan or visit<br>aldovra.com/cert<br>to check this credential</span><div class="q" id="ctQr"></div></div>' +
          "</div>" +
        "</div>" +
        '<div class="seal"><div class="disc"></div>' + seal("ALDOVRA · VERIFIED SKILL · ALDOVRA · VERIFIED SKILL ·") +
          '<div class="mid"><div><b>' + (hasScore ? esc(C.score(c.score)) : "✓") + "</b><small>Verified</small></div></div></div>" +
        (valid ? "" : '<div class="void"><span>REVOKED</span></div>') +
      "</div></div>";

    var actions = valid
      ? '<a class="btn li" href="' + esc(C.linkedInAddCert(c)) + '" target="_blank" rel="noopener">' + I.li + "Add to LinkedIn</a>" +
        '<button class="btn dark" type="button" id="ctPdf">' + I.down + "Download PDF</button>" +
        '<button class="btn" type="button" id="ctPng">' + I.img + "Download image</button>" +
        '<button class="btn" type="button" id="ctShare">' + I.share + "Share</button>" +
        (c.profile_slug ? '<a class="btn" href="/u/?' + encodeURIComponent(c.profile_slug) + '">' + I.user + "View profile</a>" : "")
      : (c.profile_slug ? '<a class="btn" href="/u/?' + encodeURIComponent(c.profile_slug) + '">' + I.user + "View profile</a>" : "");

    var facts =
      '<div class="ct-facts"><dl>' +
        "<div><dt>Holder</dt><dd>" + esc(c.holder) + "</dd></div>" +
        "<div><dt>Skill</dt><dd>" + esc(c.skill) + "</dd></div>" +
        (c.assessment ? "<div><dt>Assessment</dt><dd>" + esc(c.assessment) + "</dd></div>" : "") +
        (hasScore ? "<div><dt>Score</dt><dd>" + esc(C.score(c.score)) + "</dd></div>" : "") +
        "<div><dt>Issued</dt><dd>" + esc(issued) + "</dd></div>" +
        "<div><dt>Credential ID</dt><dd style=\"font-family:var(--mono);letter-spacing:.04em\">" + esc(c.code) + "</dd></div>" +
      "</dl></div>";

    app.innerHTML =
      '<div class="ct-page">' + status +
        '<div class="ct-layout"><div class="ct-stage reveal">' + cert + "</div>" +
        '<aside class="ct-actions reveal">' + facts + actions + "</aside></div>" +
      "</div>" +
      '<footer class="cr-foot"><span>Aldovra certificates are issued only after a proctored assessment (75%+) and a human review of the exam environment.</span>' +
        '<a href="/signup.html">Get your skills verified →</a></footer>';

    C.qr(document.getElementById("ctQr"), url);
    C.fitCert(app.querySelector(".cert-fit"));
    C.reveal(app);

    var pdf = document.getElementById("ctPdf");
    if (pdf) pdf.addEventListener("click", function () { window.print(); });
    var sh = document.getElementById("ctShare");
    if (sh) sh.addEventListener("click", function () { C.share(url, c.skill + " — verified on Aldovra"); });
    var png = document.getElementById("ctPng");
    if (png) png.addEventListener("click", function () {
      png.disabled = true; var label = png.innerHTML; png.textContent = "Preparing image…";
      loadScript("/assets/vendor/html-to-image.min.js").then(function () {
        var el = document.getElementById("certEl");
        return window.htmlToImage.toPng(el, {
          width: 1123, height: 794, pixelRatio: 2, cacheBust: true,
          style: { transform: "none", left: "0", top: "0", borderRadius: "0", boxShadow: "none" }
        });
      }).then(function (dataUrl) {
        var a = document.createElement("a");
        a.href = dataUrl; a.download = "aldovra-" + c.skill.toLowerCase().replace(/[^a-z0-9]+/g, "-") + "-" + c.code + ".png";
        document.body.appendChild(a); a.click(); a.remove();
      }).catch(function () {
        C.toast("Couldn't create the image. Try Download PDF instead.");
      }).then(function () { png.disabled = false; png.innerHTML = label; });
    });
  }

  function loadScript(src) {
    return new Promise(function (ok, ko) {
      if (window.htmlToImage) return ok();
      var s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s);
    });
  }

  if (!/^ALD-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) {
    notFound(code ? "Credential <em>not found</em>" : "Check a <em>credential</em>",
      code ? "That ID doesn't look right. Credential IDs look like ALD-7K3M-Q9XP." : "Enter the credential ID printed on an Aldovra certificate.");
    return;
  }
  C.db().rpc("verify_certificate", { p_code: code }).then(function (res) {
    if (res.error) throw res.error;
    if (!res.data || !res.data.found) {
      notFound("Credential <em>not found</em>", "No Aldovra certificate has the ID " + esc(code) + ". Check the ID and try again.");
      return;
    }
    render(res.data);
  }).catch(function () {
    notFound("Couldn't check <em>this credential</em>", "Please check your connection and refresh the page.");
  });
})();
</script>
</body>
</html>
